<title>Under Pressure</title>
<meta name="description" content="Liverpool pod performance dashboard &mdash; match-by-match stats, season leaderboards and records across competitions.">
<style>
:root{
  color-scheme: dark;
  --bg:#0a1f14; --surface:#102a1c; --surface-2:#16351f; --surface-3:#1c4126;
  --ink:#eef4ee; --ink-soft:#a9c2ad; --ink-faint:#6f8874;
  --line:#20452e; --line-strong:#2c5a3c;
  --accent:#e8b339; --accent-ink:#f4c95d; --accent-soft:#3a2f10;
  --lime:#8fd94a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#e8695f;
  --w:#0ca30c; --d:#c98500; --l:#e8695f;
  --brand-red-1:#ff6a52; --brand-red-2:#e8342a; --brand-red-3:#b81d1d;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -16px rgba(0,0,0,.7);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#3fbf3f; --s7:#9085e9; --s8:#e66767;
}
/* Under Pressure always stays on the dark green pod branding -- no light-mode
   switch, so it never falls back to a cream background regardless of the
   viewer's system theme or embedding page. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Inter","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.disp{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0}
button{font:inherit}
a{color:var(--accent-ink)}
::selection{background:var(--accent);color:#1a1206}

.wrap{max-width:1280px;margin:0 auto;padding-inline:20px}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.brandband{background:
    radial-gradient(120% 220% at 15% -40%, rgba(143,217,74,.12), transparent 60%),
    linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:18px;padding:18px 0 14px;flex-wrap:wrap}
.wordmark{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.wordmark .rule{flex:1;height:3px;background:linear-gradient(90deg, transparent, var(--lime) 15%, var(--lime) 85%, transparent);
  min-width:24px;border-radius:2px;position:relative}
.wordmark .rule::before,.wordmark .rule::after{content:"";position:absolute;top:50%;width:5px;height:5px;border-radius:50%;
  background:var(--lime);transform:translateY(-50%)}
.wordmark .rule.l::after{right:0}
.wordmark .rule.r::before{left:0}
.wordmark h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-style:italic;
  font-size:clamp(28px,5vw,44px);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;
  margin:0}
.wordmark h1 span{background-clip:text;-webkit-background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;
  text-shadow:0 1px 0 rgba(0,0,0,.25)}
.wordmark h1 .u{background-image:linear-gradient(180deg, var(--brand-red-1) 0%, var(--brand-red-2) 55%, var(--brand-red-3) 100%)}
.wordmark h1 .p{background-image:linear-gradient(180deg, var(--accent-ink) 0%, var(--accent) 55%, var(--accent) 100%)}
.meta-strip{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;padding-bottom:16px;color:var(--ink-soft);font-size:12.5px}
.meta-strip b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
.meta-strip .tag{padding:2px 8px;border-radius:99px;border:1px solid var(--line-strong);font-size:11px;letter-spacing:.03em;text-transform:uppercase}

/* competition tabs */
.tabs{display:flex;gap:4px;padding:10px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 16px;border-radius:9px;border:1px solid transparent;background:transparent;
  color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer;letter-spacing:.01em;transition:background .12s,color .12s}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--accent-ink);border-color:var(--line-strong)}
.tab .n{opacity:.6;font-family:"IBM Plex Mono",monospace;font-size:11px;margin-left:4px}

main{padding:22px 0 60px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
@media (max-width:920px){.grid{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card .hd h2{font-size:14px;font-weight:700;letter-spacing:.01em}
.card .hd .sub{color:var(--ink-faint);font-size:11.5px}
.card .bd{padding:14px 16px}
.card .bd.flush{padding:0}

/* record strip */
.record-strip{display:flex;gap:10px;flex-wrap:wrap}
.record-tile{flex:1 1 90px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:78px}
.record-tile .v{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;line-height:1}
.record-tile .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-top:4px}

/* match strip */
.matchstrip{display:flex;gap:10px;overflow-x:auto;padding:14px 16px;scrollbar-width:thin}
.mcard{flex:0 0 auto;width:132px;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--surface-2);transition:border-color .12s,transform .12s}
.mcard:hover{border-color:var(--line-strong)}
.mcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.mcard .comp{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.mcard .opp{font-weight:700;font-size:13px;margin:3px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .score{display:flex;align-items:center;gap:6px}
.mcard .score .r{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:11px;color:#0c1408}
.mcard .score .gd{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-soft)}
.mcard .date{font-size:10.5px;color:var(--ink-faint);margin-top:5px}
.r.W{background:var(--w)} .r.D{background:var(--d)} .r.L{background:var(--l)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
td:first-child,th.playercol{text-align:left;position:sticky;left:0;background:var(--surface)}
.grouphead{text-align:center;background:var(--surface-2);color:var(--ink-soft);border-left:1px solid var(--line)}
table.wide thead tr:first-child th{border-bottom:none}
thead th{color:var(--ink-faint);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
thead th.active{color:var(--accent-ink)}
td.active{background:var(--accent-soft)}
tbody tr:hover td.active{background:var(--accent-soft)}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:hover td:first-child{background:var(--surface-2)}
td.num,th.num{font-family:"IBM Plex Mono",monospace}
.tablewrap{overflow-x:auto}
.wide-wrap{max-height:min(66vh,640px);overflow:auto}
.wide-wrap thead th{position:sticky;background:var(--surface);z-index:2}
.wide-wrap thead tr:first-child th{top:0;z-index:3}
.wide-wrap thead tr:last-child th{top:24.5px}
.wide-wrap thead tr:first-child th.playercol{z-index:4}
.wide-wrap thead tr:first-child th.grouphead{background:var(--surface-2)}
.rank{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;
  background:var(--surface-3);color:var(--ink-soft);font-size:10px;font-family:"IBM Plex Mono",monospace;margin-right:6px}
.rank.g{background:var(--accent);color:#1a1206}

/* leaderboard controls */
.lb-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface-2);
  color:var(--ink-soft);font-size:12px;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
input[type="search"]{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;
  padding:7px 10px;color:var(--ink);font-size:12.5px;min-width:200px;flex:1}
input[type="search"]::placeholder{color:var(--ink-faint)}
.dirbtn{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-soft);border-radius:8px;
  padding:6px 10px;cursor:pointer;font-size:12px}
.dirbtn:hover{color:var(--ink)}

.bar-bg{background:var(--surface-3);border-radius:4px;height:6px;overflow:hidden;margin-top:4px}
.bar-fg{height:100%;border-radius:4px;background:var(--accent)}

/* highs feed */
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.feed-item:last-child{border-bottom:none}
.feed-ico{flex:0 0 auto;width:26px;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-size:13px}
.feed-txt{font-size:12.5px;line-height:1.45}
.feed-txt b{color:var(--ink)}
.feed-meta{color:var(--ink-faint);font-size:11px;margin-top:2px}

.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.pill.comp-PL{background:#233a24;color:#9fd98a}
.pill.comp-UCL{background:#1f2a44;color:#9db6f2}
.pill.comp-EFLC{background:#3a2a12;color:#f0c27a}

.empty{padding:30px 16px;text-align:center;color:var(--ink-faint);font-size:13px}
.foot{padding:24px 0 40px;color:var(--ink-faint);font-size:11.5px;text-align:center}
.foot a{color:var(--ink-faint);text-decoration:underline}

/* fatigue index tab */
.fi-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:14px}
.fi-tiles .record-tile{flex:none}
.fi-chart svg{display:block;width:100%;height:auto}
.fi-chart .ax{stroke:var(--line-strong);stroke-width:1}
.fi-chart .gl{stroke:var(--line);stroke-width:1}
.fi-chart text{fill:var(--ink-faint);font-size:10px;font-family:"IBM Plex Mono",monospace}
.fi-chart .avg{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;opacity:.75}
.fi-chart .avglab{fill:var(--ink-soft)}
.fi-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft);margin-top:8px}
.fi-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.fi-career{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.fi-career svg{display:block;max-width:none}
.fi-career .ax{stroke:var(--line-strong);stroke-width:1}
.fi-career .gl{stroke:var(--line);stroke-width:1}
.fi-career text{fill:var(--ink-faint);font-size:10px;font-family:"IBM Plex Mono",monospace}
.fi-career .avg{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:5 4;opacity:.7}
.fi-career .avglab{fill:var(--ink-soft)}
.fi-sea{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink-soft);border-radius:99px;padding:2px 9px;font-size:11px;cursor:pointer;font-family:"IBM Plex Mono",monospace}
.fi-sea[disabled]{cursor:default;color:var(--ink)}
.fi-sea.off{opacity:.38}
.fi-sea.fb{font-style:italic;border-style:dashed}
.fi-career text.sub{font-size:9px;fill:var(--ink-faint);opacity:.85}
.fi-ctab td,.fi-ctab th{font-size:11.5px}
.fi-sea.off i{background:var(--ink-faint)!important}
.fi-legend i.dot{width:9px;height:9px;border-radius:50%}
.fi-row{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:start}
@media (max-width:700px){.fi-row{grid-template-columns:1fr}}
.fi-donut{display:flex;flex-direction:column;align-items:center;gap:10px}
.fi-donut svg{width:170px;height:170px}
.fi-donut .c{fill:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600}
.fi-donut .cl{fill:var(--ink-faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em}
.fi-apps{width:100%;font-size:12px}
.fi-apps div{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.fi-apps div:last-child{border-bottom:none}
.fi-apps span:first-child{display:flex;align-items:center;gap:7px;color:var(--ink-soft)}
.fi-apps i{width:9px;height:9px;border-radius:50%;display:inline-block}
.fi-seasons{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:6px}
.fi-seasons .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.fi-seasons .bar{width:100%;max-width:34px;background:var(--surface-3);border-radius:4px 4px 0 0}
.fi-seasons .bar.cur{background:var(--accent)}
.fi-seasons .bar.proj{background:transparent;border:1px dashed var(--accent);border-bottom:none}
.fi-seasons .v{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-soft);margin-bottom:3px}
.fi-seasons .s{font-size:9.5px;color:var(--ink-faint);margin-top:4px;white-space:nowrap}
.fi-injhd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-weight:700;font-size:13px;margin-bottom:6px}
.fi-injhd .sub{font-weight:400;font-size:11.5px;color:var(--ink-faint)}
.fi-inj{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.fi-inj div{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;align-items:center}
.fi-inj div:last-child{border-bottom:none}
.fi-inj div.cur{background:var(--red-soft,#3a1a1e)}
.fi-inj .d{color:var(--ink-soft);font-size:11px}
.fi-inj .n{color:var(--ink-soft);font-size:11px;white-space:nowrap}
.fi-inj .now{background:#f8737f;color:#0c1408;border-radius:4px;padding:0 5px;font-size:10px;margin-left:4px}
@media (max-width:520px){.fi-inj div{grid-template-columns:1fr auto}.fi-inj .d{grid-column:1/-1}}
.fi-pub{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:800px){.fi-pub{grid-template-columns:1fr}}
.fi-comp{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(40px,1fr) 34px 44px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);font-size:12px}
.fi-comp .l{color:var(--ink-soft);display:flex;flex-direction:column;min-width:0}
.fi-comp .l small{color:var(--ink-faint);font-size:10.5px}
.fi-comp .bar{height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.fi-comp .bar i{display:block;height:100%;border-radius:4px}
.fi-comp .s,.fi-comp .p{text-align:right}
.fi-comp.h{color:var(--ink-faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.fi-comp.t{border-bottom:none;font-weight:700}
.fi-comp.t .l{color:var(--ink)}
tr.fi-sel td{background:var(--accent-soft)}
tr.fi-pick{cursor:pointer}
.risk{display:inline-block;min-width:24px;padding:1px 6px;border-radius:5px;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}

@media (max-width:640px){
  .wrap{padding-inline:16px}
  td,th{padding:6px 7px;font-size:12px}
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<header class="top">
  <div class="brandband">
    <div class="wrap">
      <div class="brandrow">
        <div class="wordmark">
          <span class="rule l"></span>
          <h1><span class="u">Under</span> <span class="p">Pressure</span></h1>
          <span class="rule r"></span>
        </div>
      </div>
      <div class="meta-strip">
        <span>Liverpool Pod &middot; Performance Dashboard</span>
        <span class="tag" id="seasonTag">2026&ndash;27</span>
        <span id="lastUpdated"></span>
      </div>
    </div>
  </div>
  <div class="wrap">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Competition"></nav>
  </div>
</header>

<main class="wrap" id="app">
  <div class="empty">Loading match data&hellip;</div>
</main>

<div class="foot">Source data: pod-collated match sheets + public box scores where noted &middot; built for internal pod use</div>

<script>
(function(){
"use strict";

const FRIENDLY = {
  "Running m [BS]": "Running m (Total)", "Running m [BW]": "Running m (P90)",
  "Sprint m [BT]": "Sprint m (Total)", "Sprint m [BX]": "Sprint m (P90)",
  "Sprints [BU]": "Sprints (Total)", "Sprints [BY]": "Sprints (P90)",
  "Int + Rec": "Interceptions + Recoveries", "PAdj Presses": "PAdj Presses (possession-adjusted)", "CIB": "Carries Into Box",
  "XG (public)": "xG (public box score)", "SCA": "Chances created (key passes)", "SCA per100": "Chances created per 100 touches", "GCA": "Goal-Creating Actions",
};
function label(key){ return FRIENDLY[key] || key; }

// xT added per 100 touches (computed in pipeline.py from Dr Barts' per-match EPV)
const XT100 = "xT added per 100 touches";
const XT100_NOTE = "EPV created minus EPV received, per 100 touches. Higher means more value added per touch.";
function fmtVal(metric, v){
  if (metric === XT100 && typeof v === "number") return (v > 0 ? "+" : v < 0 ? "&minus;" : "") + Math.abs(v).toFixed(2);
  return v;
}
function metricNote(metric){
  return metric === XT100 ? `<div class="empty" style="padding:0 0 10px;text-align:left;font-size:11.5px">${XT100_NOTE}</div>` : "";
}

const HEADLINE_METRICS = [
  "Goals","Assists","Shots","SOT","Big Chances","SCA","GCA","Successful Dribbles",
  "Top Speed","Distance (P90)","Sprints (P90)","Touches","Completed Passes","Progressive Carries","Prog"
];

const QUICK_METRICS = ["Goals","Assists","Big Chances","SCA","xT added per 100 touches","Top Speed","Distance (P90)","Successful Dribbles","Touches"];

// Full column set for the match box-score table, grouped the way the pod's
// own sheet groups them -- this is the whole tracked metric set, not a
// generic goals/assists/shots subset. Only groups/columns with data for the
// selected match actually render (see renderMatchDetail).
const METRIC_GROUPS = [
  ["Playing time", ["Mins","Touches","% team"]],
  ["Passing", ["Completed Passes","Attempts","%","% Progressive","CompFinal 3rd","non SP Passes into Box","Prog","Through balls","Successful Switch","Successful Cross","Failed Cross"]],
  ["Carrying & dribbling", ["Carries","CIB","% touches carried","Prog Dist","Progressive Carries","Successful Dribbles","Attempted Dribbles","Dribb Success%"]],
  ["Defending & duels", ["Int + Rec","Duels+/-","Aerials +/-","% Touches won","Possessions lost","Ball Retention %","% possession won","Tackles","Interceptions","Blocks"]],
  ["Creating", ["SCA","GCA","Big Chances","Big Assist","Pen Wins","Hockey Assist","Touches inside box"]],
  ["Shooting & goals", ["Shots","SOT","off Target","Blocked","Big Chance Scored","Big Chance missed","Pens Scored","Pens Missed","Goals","Assists","Equaliser","Go Ahead"]],
  ["Expected", ["XG shots","XG assist","XG2","XT","xT added per 100 touches","XGBuild Up","PC","PC90","XGB100","XGT100","XG (public)"]],
  ["Off the ball: EPV", ["EPV Received","EPV Created","EPV Faced","EPV Lost %"]],
  ["Off the ball: pressing", ["Total Presses","PAdj Presses","Successful Presses","Failed Presses","Counter Presses"]],
  ["Goalkeeping", ["Shots Faced","Saves","PSxG","Goals Conceded"]],
  ["Physical", ["Top Speed","Distance (Total)","Running m [BS]","Sprint m [BT]","Sprints [BU]","Distance (P90)","Running m [BW]","Sprint m [BX]","Sprints [BY]","%HS"]],
  ["Discipline & other", ["Error","DECT Goal","Ofsides","Yellow Cards","Rating","Player of the Match"]],
];

const TABS = [
  { id:"PL",   label:"Premier League", kind:"club", test:c => c === "PL" },
  { id:"CL",   label:"Champions League", kind:"club", test:c => c === "UCL" },
  { id:"CUPS", label:"Cups", kind:"club", test:c => c === "EFLC" },
  { id:"LFC",  label:"LFC - All Club", kind:"club", test:() => true },
  { id:"INTL", label:"Internationals", kind:"intl" },
  { id:"ALL",  label:"All Football", kind:"all" },
  { id:"FI",   label:"Fatigue Index", kind:"fi" },
];

let DATA = null;
let activeTab = "LFC";
let selectedMatch = null; // tab (name) of the match card selected, per active tab

function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-GB", { day:"2-digit", month:"short" });
}

function esc(s){ return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

function matchesForTab(tab){
  if (tab.kind !== "club") return [];
  return DATA.matches_meta.filter(m => tab.test(m.competition));
}
function recordsForTab(tab){
  if (tab.kind !== "club") return [];
  return DATA.match_records.filter(r => tab.test(r.competition));
}

// ---------- header / tabs ----------
function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TABS.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "tab"; btn.type = "button"; btn.setAttribute("role","tab");
    btn.setAttribute("aria-selected", String(t.id === activeTab));
    let n = "";
    if (t.kind === "club") n = matchesForTab(t).length;
    else if (t.kind === "intl") n = Object.keys(DATA.internationals || {}).length;
    else if (t.kind === "fi") n = fiPlayers().length;
    btn.innerHTML = `${esc(t.label)}${n !== "" ? `<span class="n">${n}</span>` : ""}`;
    btn.addEventListener("click", () => { activeTab = t.id; selectedMatch = null; render(); });
    nav.appendChild(btn);
  });
}

// ---------- squad summary (safe-sum aggregate over match_records) ----------
const SUM_COLS = [
  ["Games","Games"],["Mins","Mins"],["Goals","Gls"],["Assists","Ast"],
  ["Shots","Sh"],["SOT","SoT"],["Big Chances","BC"],["Touches","Tch"]
];
function buildSquadSummary(records){
  const byPlayer = {};
  for (const r of records){
    const p = byPlayer[r.player] || (byPlayer[r.player] = { player:r.player, Games:0, Mins:0, Goals:0, Assists:0, Shots:0, SOT:0, "Big Chances":0, Touches:0, _cmp:0, _att:0, _ratings:[] });
    p.Games += 1;
    for (const k of ["Mins","Goals","Assists","Shots","SOT","Big Chances","Touches"]){
      const v = r.stats[k];
      if (typeof v === "number") p[k] += v;
    }
    if (typeof r.stats["Completed Passes"] === "number") p._cmp += r.stats["Completed Passes"];
    if (typeof r.stats["Attempts"] === "number") p._att += r.stats["Attempts"];
    if (typeof r.stats["Rating"] === "number") p._ratings.push(r.stats["Rating"]);
  }
  return Object.values(byPlayer).map(p => ({
    ...p,
    PassPct: p._att ? Math.round((p._cmp / p._att) * 1000) / 10 : null,
    RatingAvg: p._ratings.length ? Math.round((p._ratings.reduce((a,b)=>a+b,0) / p._ratings.length) * 100) / 100 : null,
  }));
}

let squadSort = { col: "Mins", dir: -1 };
function renderSquadSummary(records){
  const rows = buildSquadSummary(records);
  const cols = [...SUM_COLS, ["PassPct","Pass %"], ["RatingAvg","Rtg"]];
  rows.sort((a,b) => {
    const av = a[squadSort.col] ?? -Infinity, bv = b[squadSort.col] ?? -Infinity;
    if (squadSort.col === "player") return squadSort.dir === -1 ? String(bv).localeCompare(String(av)) : String(av).localeCompare(String(bv));
    return squadSort.dir === -1 ? (bv - av) : (av - bv);
  });
  let head = `<th class="playercol">Player</th>` + cols.map(([k,l]) => `<th class="num${squadSort.col===k?' active':''}" data-col="${k}">${esc(l)}</th>`).join("");
  let body = rows.map(r => `<tr><td>${esc(r.player)}</td>` + cols.map(([k]) => {
    const v = r[k];
    return `<td class="num">${v===null||v===undefined ? "&ndash;" : (Number.isInteger(v)?v:v.toFixed( k==='PassPct'||k==='RatingAvg' ? (k==='RatingAvg'?2:1) : 0))}</td>`;
  }).join("") + `</tr>`).join("");
  if (!rows.length) return `<div class="empty">No matches in this competition yet.</div>`;
  return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

// ---------- record strip ----------
function renderRecordStrip(matches){
  let W=0,D=0,L=0,GF=0,GA=0;
  matches.forEach(m => { W += m.result==="W"; D += m.result==="D"; L += m.result==="L"; GF += m.score_for||0; GA += m.score_against||0; });
  const tiles = [["P",matches.length],["W",W],["D",D],["L",L],["GF",GF],["GA",GA],["GD", (GF-GA)>0?`+${GF-GA}`:(GF-GA)]];
  return `<div class="record-strip">${tiles.map(([l,v]) => `<div class="record-tile"><div class="v mono">${v}</div><div class="l">${l}</div></div>`).join("")}</div>`;
}

// ---------- match strip + detail ----------
function renderMatchStrip(matches, tab){
  if (!matches.length) return "";
  const sorted = [...matches].sort((a,b) => a.date.localeCompare(b.date));
  if (!selectedMatch || !sorted.find(m=>m.tab===selectedMatch)) selectedMatch = sorted[sorted.length-1].tab;
  return `<div class="matchstrip">${sorted.map(m => `
    <div class="mcard" role="button" tabindex="0" aria-pressed="${m.tab===selectedMatch}" data-match="${esc(m.tab)}">
      <div class="comp">${esc(m.competition)} &middot; ${esc(m.venue==='H'?'Home':m.venue==='A'?'Away':'Neutral')}</div>
      <div class="opp">${esc(m.opponent)}</div>
      <div class="score"><span class="r ${m.result}">${m.result}</span><span class="gd mono">${m.score_for}&ndash;${m.score_against}</span></div>
      <div class="date">${fmtDate(m.date)}</div>
    </div>`).join("")}</div>`;
}

let matchSort = { col: "Mins", dir: -1 };
function renderMatchDetail(matches, records){
  const m = matches.find(x => x.tab === selectedMatch);
  if (!m) return `<div class="empty">Select a match above.</div>`;
  const recs = records.filter(r => r.match === m.tab).sort((a,b) => {
    const av = a.stats[matchSort.col] ?? -Infinity, bv = b.stats[matchSort.col] ?? -Infinity;
    return matchSort.dir === -1 ? (bv - av) : (av - bv);
  });

  const present = new Set();
  recs.forEach(r => Object.keys(r.stats).forEach(k => present.add(k)));
  if (!present.has(matchSort.col)) matchSort.col = "Mins";
  const groups = METRIC_GROUPS
    .map(([name, cols]) => [name, cols.filter(c => present.has(c))])
    .filter(([,cols]) => cols.length);
  // any tracked metric not covered by a named group still gets shown, under "Other"
  const grouped = new Set(groups.flatMap(([,cols]) => cols));
  const leftover = [...present].filter(c => !grouped.has(c));
  if (leftover.length) groups.push(["Other", leftover]);

  const groupRow = `<tr><th rowspan="2" class="playercol">Player</th>` + groups.map(([name, cols]) => `<th colspan="${cols.length}" class="grouphead">${esc(name)}</th>`).join("") + `</tr>`;
  const colRow = `<tr>` + groups.flatMap(([,cols]) => cols.map(c => `<th class="num${matchSort.col===c?' active':''}" data-col="${esc(c)}" title="Sort by ${esc(label(c))}${c === XT100 ? " \u2014 " + XT100_NOTE : ""}">${esc(label(c))}</th>`)).join("") + `</tr>`;
  const head = groupRow + colRow;
  const allCols = groups.flatMap(([,cols]) => cols);
  let body = recs.map(r => `<tr><td>${esc(r.player)}</td>` + allCols.map(c => {
    const v = r.stats[c];
    return `<td class="num${matchSort.col===c?' active':''}">${v===undefined? "&ndash;" : v}</td>`;
  }).join("") + `</tr>`).join("");

  const events = (DATA.season_high_events || []).filter(e => e.match === m.tab && HEADLINE_METRICS.includes(e.metric));
  const highsHtml = events.length
    ? `<div class="bd" style="padding-top:0">${events.map(e => `
        <div class="feed-item" style="padding:8px 0">
          <div class="feed-ico">\u{1F525}</div>
          <div class="feed-txt"><b>${esc(e.player)}</b> hit a season high: <b>${e.value}</b> ${esc(label(e.metric))}</div>
        </div>`).join("")}</div>`
    : `<div class="empty" style="padding:16px">No season highs set in this match (within the headline metric set).</div>`;

  return `
    <div class="tablewrap wide-wrap">${recs.length ? `<table class="wide"><thead>${head}</thead><tbody>${body}</tbody></table>` : `<div class="empty">No player data for this match${m.source ? " beyond the public box score" : ""}.</div>`}</div>
    ${m.source ? `<div class="empty" style="padding:10px 16px 0;text-align:left;font-size:11px">${esc(m.source)}</div>` : ""}
    <div class="hd" style="margin-top:6px"><h2>Season highs set here</h2></div>
    ${highsHtml}
  `;
}

// ---------- metric polarity: for these, a lower number is the better one ----------
const LOWER_BETTER = /^(mins per|mins npg|mnsga|posessions lost|possessions lost|% touches lost|touches per prog pass|shots off)/i;
function bestDir(metric){ return LOWER_BETTER.test(metric) ? 1 : -1; }
// "Mins per X" of 0 means the player has none of X yet, not a perfect rate
function validRate(metric, v){ return typeof v === "number" && !(/^(mins per|mins npg|mnsga)/i.test(metric) && v <= 0); }

// ---------- leaderboard explorer (single-match, per-record) ----------
let lbMetric = "Goals";
let lbDir = -1;
let lbAll = false;
function renderLeaderboard(records){
  const metricsAvail = new Set();
  records.forEach(r => Object.keys(r.stats).forEach(k => { if (typeof r.stats[k] === "number") metricsAvail.add(k); }));
  const metrics = [...metricsAvail].sort();
  if (!metrics.includes(lbMetric)) lbMetric = metrics.includes("Goals") ? "Goals" : metrics[0];

  const entries = records
    .filter(r => typeof r.stats[lbMetric] === "number")
    .map(r => ({ player:r.player, match:r.match, competition:r.competition, date:r.date, value:r.stats[lbMetric] }))
    .sort((a,b) => lbDir === -1 ? (b.value - a.value) : (a.value - b.value));
  const top = lbAll ? entries : entries.slice(0, 10);
  const max = top.length ? Math.max(...top.map(e => Math.abs(e.value)), 1) : 1;
  const seasonHigh = DATA.season_high_events.filter(e => e.metric === lbMetric).slice(-1)[0];

  const rows = top.map((e,i) => `
    <tr>
      <td><span class="rank${i===0 && lbDir===bestDir(lbMetric) ?' g':''}">${i+1}</span>${esc(e.player)}</td>
      <td class="num">${fmtVal(lbMetric, e.value)}<div class="bar-bg"><div class="bar-fg" style="width:${Math.max(4, Math.abs(e.value)/max*100)}%"></div></div></td>
      <td><span class="pill comp-${esc(e.competition)}">${esc(e.competition)}</span></td>
      <td>${esc(e.match)}</td>
      <td>${fmtDate(e.date)}</td>
    </tr>`).join("");

  return `
    <div class="lb-controls">
      <input type="search" id="lbSearch" list="metricList" placeholder="Search a metric&hellip;" value="${esc(label(lbMetric))}">
      <datalist id="metricList">${metrics.map(m => `<option value="${esc(label(m))}">`).join("")}</datalist>
      <button class="dirbtn" id="lbDirBtn">${lbDir===-1 ? "Highest first" : "Lowest first"}</button>
      <button class="dirbtn" id="lbAllBtn">${lbAll ? "Top 10 only" : `Show all ${entries.length}`}</button>
    </div>
    <div class="lb-controls" style="margin-bottom:14px">
      ${QUICK_METRICS.map(m => `<button class="chip" data-metric="${esc(m)}" aria-pressed="${m===lbMetric}">${esc(label(m))}</button>`).join("")}
    </div>
    ${metricNote(lbMetric)}${lbMetric === XT100 ? `<div class="empty" style="padding:0 0 10px;text-align:left;font-size:11.5px">Per match, only games with 20+ touches.</div>` : ""}
    ${seasonHigh ? `<div class="empty" style="padding:8px 0 14px;text-align:left;color:var(--ink-soft)">Season high so far: <b style="color:var(--ink)">${esc(seasonHigh.player)}</b> &mdash; ${seasonHigh.value} vs ${esc(seasonHigh.opponent)} (${fmtDate(seasonHigh.date)})</div>` : ""}
    <div class="tablewrap"><table>
      <thead><tr><th class="playercol">Player</th><th class="num">${esc(label(lbMetric))}</th><th>Comp</th><th>Match</th><th>Date</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="empty">No data for this metric in this competition scope.</td></tr>`}</tbody>
    </table></div>
  `;
}

// ---------- season rate leaderboard (from Dashboard tab totals) ----------
let srMetric = "Conv Rate%";
let srDir = bestDir(srMetric);
let srAll = false;
function renderSeasonRates(){
  const totals = DATA.dashboard_season_totals || {};
  const metricsAvail = new Set();
  Object.values(totals).forEach(p => Object.keys(p).forEach(k => { if (typeof p[k] === "number" && !["Height","Age 1 Aug"].includes(k)) metricsAvail.add(k); }));
  const metrics = [...metricsAvail].sort();
  if (!metrics.includes(srMetric)) srMetric = metrics[0];

  // Strike-rate stats ("Mins per X") and loss counts: lower is better, so they
  // default to lowest first. The direction button flips either way.
  const entries = Object.entries(totals)
    // skip the sheet's squad "Total" row and anyone without minutes; when
    // ranking highest first, a 0 is no performance worth listing
    .filter(([player,p]) => !/^total$/i.test(player.trim()) && (p.Mins || 0) > 0
      && validRate(srMetric, p[srMetric]) && !(srDir === -1 && p[srMetric] === 0 && srMetric !== XT100))
    .map(([player,p]) => ({ player, value:p[srMetric], mins:p.Mins }))
    .sort((a,b) => srDir === -1 ? (b.value - a.value) : (a.value - b.value));
  // xT per 100 touches only ranks players with 100+ touches; the rest sit greyed below a divider
  const isXt = srMetric === XT100, xt = DATA.xt100 || {};
  const ranked = isXt ? entries.filter(e => (xt[e.player] || {}).ranked) : entries;
  const unranked = isXt ? entries.filter(e => !(xt[e.player] || {}).ranked) : [];
  const top = srAll ? ranked : ranked.slice(0,10);
  const max = top.length ? Math.max(...top.map(e=>Math.abs(e.value)),1) : 1;
  const row = (e, i, grey) => `
    <tr${grey ? ' style="opacity:.45"' : ""}><td><span class="rank${!grey && i===0 && srDir===bestDir(srMetric)?' g':''}">${grey ? "&ndash;" : i+1}</span>${esc(e.player)}${isXt ? `<span style="color:var(--ink-faint);font-size:10.5px"> &middot; ${(xt[e.player]||{}).touches ?? "?"} touches</span>` : ""}</td>
    <td class="num">${typeof e.mins === "number" ? e.mins : "&ndash;"}</td>
    <td class="num">${fmtVal(srMetric, e.value)}<div class="bar-bg"><div class="bar-fg" style="width:${Math.max(4,Math.abs(e.value)/max*100)}%"></div></div></td></tr>`;
  const rows = top.map((e,i) => row(e, i, false)).join("")
    + (srAll && unranked.length ? `<tr><td colspan="3" style="color:var(--ink-faint);font-size:11px">Under 100 touches &mdash; not ranked</td></tr>` + unranked.map((e,i) => row(e, i, true)).join("") : "");

  return `
    <div class="lb-controls">
      <input type="search" id="srSearch" list="srMetricList" placeholder="Search a season metric&hellip;" value="${esc(label(srMetric))}">
      <datalist id="srMetricList">${metrics.map(m => `<option value="${esc(label(m))}">`).join("")}</datalist>
      <button class="dirbtn" id="srDirBtn">${srDir===-1 ? "Highest first" : "Lowest first"}</button>
      <button class="dirbtn" id="srAllBtn">${srAll ? "Top 10 only" : `Show all ${entries.length}`}</button>
    </div>
    ${metricNote(srMetric)}
    <div class="tablewrap"><table><thead><tr><th class="playercol">Player</th><th class="num">Mins</th><th class="num">${esc(label(srMetric))}</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="3" class="empty">No data.</td></tr>`}</tbody></table></div>
  `;
}

// ---------- internationals ----------
function renderInternationals(){
  const rows = Object.entries(DATA.internationals || {})
    .map(([player,v]) => ({ player, Mins:v.Mins||0, Goals:v.Goals||0, Assists:v.Assists||0 }))
    .sort((a,b) => b.Goals - a.Goals || b.Assists - a.Assists || b.Mins - a.Mins);
  if (!rows.length) return `<div class="empty">No international caps logged yet this window.</div>`;
  return `<div class="tablewrap"><table><thead><tr><th class="playercol">Player</th><th class="num">Mins</th><th class="num">Gls</th><th class="num">Ast</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r.player)}</td><td class="num">${r.Mins}</td><td class="num">${r.Goals}</td><td class="num">${r.Assists}</td></tr>`).join("")}</tbody></table></div>`;
}

function renderAllCombined(records){
  const club = {};
  buildSquadSummary(records).forEach(p => club[p.player] = p);
  const intl = DATA.internationals || {};
  const players = new Set([...Object.keys(club), ...Object.keys(intl)]);
  const rows = [...players].map(player => {
    const c = club[player] || { Mins:0, Goals:0, Assists:0 };
    const i = intl[player] || { Mins:0, Goals:0, Assists:0 };
    return { player, cMins:c.Mins||0, cGoals:c.Goals||0, cAssists:c.Assists||0,
      iMins:i.Mins||0, iGoals:i.Goals||0, iAssists:i.Assists||0,
      tGoals:(c.Goals||0)+(i.Goals||0), tAssists:(c.Assists||0)+(i.Assists||0) };
  }).sort((a,b) => b.tGoals - a.tGoals || b.tAssists - a.tAssists);
  return `<div class="tablewrap"><table><thead><tr><th class="playercol">Player</th>
    <th class="num">Club Gls</th><th class="num">Club Ast</th>
    <th class="num">Intl Gls</th><th class="num">Intl Ast</th>
    <th class="num">Total Gls</th><th class="num">Total Ast</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r.player)}</td>
      <td class="num">${r.cGoals}</td><td class="num">${r.cAssists}</td>
      <td class="num">${r.iGoals}</td><td class="num">${r.iAssists}</td>
      <td class="num">${r.tGoals}</td><td class="num">${r.tAssists}</td></tr>`).join("")}</tbody></table></div>`;
}

// ---------- fatigue index (Liverpool players, from the sheet's "Fatigue Index" tab) ----------
const FI_APPS = [
  ["full90","Full 90","#3987e5"], ["sub_on","Sub on","#3fbf3f"], ["sub_off","Sub off","#e8b339"],
  ["sub_off_inj","Sub off injured","#ec835a"], ["unused","Unused","#e8342a"], ["not_selected","Not selected","#d55181"],
  ["injured_games","Injured","#8a948c"], ["suspended","Suspended","#9085e9"], ["sent_off","Sent off","#b81d1d"],
];
const FI_COLS = [
  ["season_mins","Season mins",-1], ["lfc_mins","LFC mins",-1], ["pct_started","% started",-1],
  ["weekly_ave","Weekly ave",-1], ["pct_vs_3yr","% vs 3yr ave",-1], ["pct_vs_career_max","% vs career max",-1],
  ["vs_optimal","Vs optimal",-1], ["risk_factor","Risk factor",-1],
];
let fiPlayer = null;
let fiSort = { col:"season_mins", dir:-1 };

function fiPlayers(){
  const fi = DATA.fatigue_index || {};
  return Object.keys(fi).filter(n => {
    const m = fi[n].metrics || {};
    return (m.season_mins || 0) > 0 || (fi[n].apps && fi[n].apps.injured_games);
  });
}
function fiNum(v, dp){
  if (v === null || v === undefined || v === "") return "&ndash;";
  return typeof v === "number" ? (dp != null ? v.toFixed(dp) : v.toLocaleString("en-GB")) : esc(v);
}
// Fatigue Index dashboard bands: red > 65, amber 40-65, green < 40 (its own colours)
const FI_BAND = { red:"#f8737f", amber:"#e6a44b", green:"#4ade80" };
// Simon's Risk Factor bands (0-12 sheet scale): 6 and below green, over 6 to 11 amber, over 11 red
function riskColour(r){
  if (typeof r !== "number") return "var(--surface-3)";
  return r > 11 ? FI_BAND.red : r > 6 ? FI_BAND.amber : FI_BAND.green;
}
function riskBadge(r){
  const banded = typeof r === "number";
  return `<span class="risk" style="background:${riskColour(r)}${banded ? ";color:#0c1408" : ""}" title="Risk factor: 6 and below green, 7&ndash;11 amber, above 11 red">${fiNum(r)}</span>`;
}
function fiInj(name){ return (DATA.fi_published || {})[name] || null; }
const FI_SCORELAB = {injury_hist:"Prior injury burden", season_load:"Season load vs history",
  congestion:"Fixture congestion", min_acwr:"Minutes ACWR", hi_acwr:"Hi-intensity ACWR",
  sprint_spike:"Sprint load spike", hi_pct_swing:"Hi-speed % swing", age_youth:"Age / youth",
  travel:"International travel"};
const FI_INPUT = { season_load:v => `${v}% of norm`, min_acwr:v => `ratio ${v}`, hi_acwr:v => `ratio ${v}`,
  sprint_spike:v => `ratio ${v}`, hi_pct_swing:v => `${v > 0 ? "+" : ""}${v} pts`, travel:v => `${Math.round(v).toLocaleString("en-GB")} km`,
  congestion:v => `${v}d since last game` };
const fiScoreCol = s => s == null ? "var(--surface-3)" : s > 65 ? FI_BAND.red : s >= 40 ? FI_BAND.amber : FI_BAND.green;
function fiHistory(hist){
  const pts = hist.filter(h => h.index != null);
  if (pts.length < 2) return `<div class="empty" style="padding:10px 0;text-align:left">Not enough ranked weeks for a history line.</div>`;
  const W = 640, H = 150, L = 30, R = 10, T = 8, B = 22;
  const t0 = +new Date(hist[0].d), t1 = +new Date(hist[hist.length-1].d);
  const x = d => L + (+new Date(d) - t0) / Math.max(1, t1 - t0) * (W - L - R);
  const y = v => T + (1 - v / 100) * (H - T - B);
  const band = (lo, hi, c) => `<rect x="${L}" width="${W-L-R}" y="${y(hi)}" height="${y(lo)-y(hi)}" fill="${c}" opacity=".13"/>`;
  // a gap where the player wasn't ranked that week
  let path = "", prev = false;
  hist.forEach(h => { if (h.index == null){ prev = false; return; }
    path += `${prev ? "L" : "M"}${x(h.d).toFixed(1)},${y(h.index).toFixed(1)}`; prev = true; });
  let g = band(0, 40, FI_BAND.green) + band(40, 65, FI_BAND.amber) + band(65, 100, FI_BAND.red);
  for (const v of [0, 40, 65, 100]) g += `<text x="${L-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const months = []; const d0 = new Date(hist[0].d);
  for (let m = new Date(d0.getFullYear(), d0.getMonth() + 1, 1); +m <= t1; m.setMonth(m.getMonth() + 3)) months.push(new Date(m));
  g += months.map(m => `<text x="${x(m.toISOString().slice(0,10))}" y="${H-6}" text-anchor="middle">${m.toLocaleDateString("en-GB",{month:"short",year:"2-digit"})}</text>`).join("");
  const last = pts[pts.length-1];
  const hs = hist.map((h, i) => ({ ...h, i })).filter(h => h.index != null);
  const hboxes = fiSpells(fiPlayer).map(s => {
    const idx = hs.filter(h => h.d >= s.from && h.d <= s.to);
    // a spell shorter than a week can fall between snapshots: bracket the nearest week instead
    const use = idx.length ? idx : hs.filter(h => Math.abs(+new Date(h.d) - +new Date(s.from)) < 4 * DAY);
    if (!use.length || s.to < hist[0].d || s.from > hist[hist.length-1].d) return "";
    const xs = hs.map(h => x(h.d)), ys = hs.map(h => y(h.index));
    return fiInjBox(xs, ys, hs.indexOf(use[0]), hs.indexOf(use[use.length-1]), s);
  }).join("");
  return `<div class="fi-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fatigue Index history">${g}${hboxes}
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map(h => `<circle cx="${x(h.d)}" cy="${y(h.index)}" r="2.6" fill="${fiScoreCol(h.index)}"><title>${fiDate(h.d)}: ${h.index} (${h.band})</title></circle>`).join("")}
    <circle cx="${x(last.d)}" cy="${y(last.index)}" r="4.5" fill="${fiScoreCol(last.index)}" stroke="var(--bg)" stroke-width="1.5"/></svg></div>`;
}
function fiPublished(name){

function fiBadge(name){

// mean of the last 4 weekly totals; a week off counts as 0, weeks 1-3 use what there is
function rolling4(pts){
  return pts.map((p, i) => {
    const win = pts.slice(Math.max(0, i - 3), i + 1);
    return { week:p.week, mins: Math.round(win.reduce((a,q) => a + (q.mins || 0), 0) / win.length), raw:p.mins || 0 };
  });
}
function fiDate(s){ return s ? new Date(s + "T00:00:00").toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"2-digit" }) : ""; }
function fiInjuries(name){

// ---------- injury boxes (same look as the Fatigue Index dashboard's player charts) ----------
// Weekly charts are by season week: week 1 = Monday of the week of Liverpool's first
// competitive match (Community Shield included), +7 days a week. Checked against
// Frimpong 23 Oct-15 Dec 2025 (weeks 12-20) and VVD's ACL from 19 Oct 2020 (week 9).
const FI_SEASON_START = {"17/18":"2017-08-12","18/19":"2018-08-12","19/20":"2019-08-04","20/21":"2020-08-29",
  "21/22":"2021-08-14","22/23":"2022-07-30","23/24":"2023-08-13","24/25":"2024-08-17","25/26":"2025-08-10","26/27":"2026-08-23"};
const DAY = 864e5;
function fiWeek1(s){ const d = new Date(FI_SEASON_START[s] + "T00:00:00Z"); return +d - ((d.getUTCDay() + 6) % 7) * DAY; }
function fiWeekOf(s, iso){ return Math.floor((+new Date(iso + "T00:00:00Z") - fiWeek1(s)) / (7 * DAY)) + 1; }
function fiSpells(name){
  const j = fiInj(name); if (!j) return [];
  const today = j.as_of || new Date().toISOString().slice(0,10);
  return (j.spells || []).map(s => ({ ...s, to: s.until || today }));
}
function fiInjTitle(s){
  return `${s.injury || "Injury"} \u2014 ${s.from}${s.until ? " to " + s.until : " (ongoing)"}${s.days != null ? ` (${s.days}d)` : ""}`
    + `${s.games_missed != null ? ` \u00b7 ${s.club_games_missed ?? s.games_missed} games missed` : ""}`;
}
// dashed red box bracketing the stretch of line between index i0 and i1
function fiInjBox(xs, ys, i0, i1, s){
  if (i1 < i0) return "";
  const seg = ys.slice(i0, i1 + 1);
  const x0 = xs[i0] - 4, x1 = xs[i1] + 4, y0 = Math.min(...seg) - 6, y1 = Math.max(...seg) + 6;
  return `<rect x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${(x1 - x0).toFixed(1)}" height="${Math.max(12, y1 - y0).toFixed(1)}"
    rx="3" fill="${FI_BAND.red}" fill-opacity=".06" stroke="${FI_BAND.red}" stroke-width="1.3" stroke-dasharray="3,2"><title>${esc(fiInjTitle(s))}</title></rect>`;
}
// boxes over one season's weekly points ({week, ...}); xOf/yOf map a point to the chart
function fiInjBoxesWeekly(season, pts, xOf, yOf, spells){
  if (!pts.length || !FI_SEASON_START[season]) return "";
  const xs = pts.map(xOf), ys = pts.map(yOf);
  return spells.map(s => {
    const w0 = fiWeekOf(season, s.from), w1 = fiWeekOf(season, s.to);
    const idx = pts.map((p, i) => p.week >= w0 && p.week <= w1 ? i : -1).filter(i => i >= 0);
    return idx.length ? fiInjBox(xs, ys, idx[0], idx[idx.length - 1], s) : "";
  }).join("");
}

// one colour per season; the current season keeps the accent and sits on top
const FI_SEASON_COL = {"17/18":"#9085e9","18/19":"#8fd94a","19/20":"#3987e5","20/21":"#f4a259","21/22":"#d55181",
  "22/23":"#4fb6c8","23/24":"#a9b3ab","24/25":"#e66767","25/26":"#3fbf3f"};
const FI_CUR = "26/27";
let fiHidden = new Set();
function fiSeries(name){
  const hist = Object.assign({}, (DATA.weekly_history || {})[name] || {});
  if (!hist["25/26"] && (DATA.weekly_2526 || {})[name]) hist["25/26"] = DATA.weekly_2526[name];
  const out = Object.keys(hist).sort()
    // a season of nothing but zeros (before he joined) draws a flat line on the axis; leave it out
    .filter(s => (hist[s] || []).some(p => (p.mins || 0) > 0))
    .map(s => ({ s, col: FI_SEASON_COL[s] || "#8a948c", pts: rolling4(hist[s]) }));
  out.push({ s: FI_CUR, col: "var(--accent)", cur: true, pts: rolling4((DATA.fatigue_index[name] || {}).weekly || []) });
  return out;
}
function fiChart(name){
  const series = fiSeries(name);
  const shown = series.filter(x => !fiHidden.has(x.s) || x.cur);
  const cur = series[series.length - 1].pts;
  const maxWeek = Math.max(10, ...shown.map(x => x.pts.length ? x.pts[x.pts.length-1].week : 0));
  const maxMins = Math.max(200, ...shown.flatMap(x => x.pts.map(p => p.mins || 0)));
  const yTop = Math.ceil(maxMins / 50) * 50;
  const W = 640, H = 260, L = 38, R = 70, T = 12, B = 26;
  const x = w => L + (w - 1) / Math.max(1, maxWeek - 1) * (W - L - R);
  const y = v => T + (1 - v / yTop) * (H - T - B);
  const path = pts => pts.filter(p => p.mins != null).map((p,i) => `${i?"L":"M"}${x(p.week).toFixed(1)},${y(p.mins).toFixed(1)}`).join("");
  const played = cur.filter(p => p.mins != null);
  const avg = played.length ? Math.round(played.reduce((a,p)=>a+p.raw,0) / played.length) : null;
  let g = "";
  for (let v = 0; v <= yTop; v += 50) g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const step = maxWeek > 30 ? 5 : maxWeek > 15 ? 2 : 1;
  for (let w = 1; w <= maxWeek; w += step) g += `<text x="${x(w)}" y="${H-8}" text-anchor="middle">${w}</text>`;
  const lines = shown.filter(sr => !sr.cur).map(sr =>
    `<path d="${path(sr.pts)}" fill="none" stroke="${sr.col}" stroke-width="1.8" opacity=".8" stroke-linejoin="round"><title>${sr.s}</title></path>`).join("");
  const spells = fiSpells(name);
  const hist = shown.filter(sr => !sr.cur);
  const boxed = [series[series.length - 1], ...(hist.length === 1 ? hist : [])];
  const boxes = boxed.map(sr => fiInjBoxesWeekly(sr.s, sr.pts.filter(p => p.mins != null), p => x(p.week), p => y(p.mins), spells)).join("");
  const dots = played.map(p => `<circle cx="${x(p.week)}" cy="${y(p.mins)}" r="3" fill="var(--accent)"><title>${FI_CUR} week ${p.week}: 4-week average ${p.mins} mins (this week ${p.raw})</title></circle>`).join("");
  const cm = (DATA.career_meta || {})[name] || {};
  const chips = series.map(sr => { const tag = fiSeasonTag(cm[sr.s], sr.s);
    return `<button type="button" class="fi-sea${fiHidden.has(sr.s) && !sr.cur ? " off" : ""}${(cm[sr.s] || {}).source === "fbref" ? " fb" : ""}" data-fisea="${sr.s}"${sr.cur ? " disabled" : ""}${tag ? ` title="${esc(tag)}"` : ""}><i style="background:${sr.col}"></i>${sr.s}</button>`; }).join("");
  return `<div class="fi-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="4-week rolling average minutes by season for ${esc(name)}">
    ${g}<line class="ax" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>${lines}
    <path d="${path(cur)}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>${dots}${boxes}
    ${avg != null ? `<line class="avg" x1="${L}" x2="${W-R}" y1="${y(avg)}" y2="${y(avg)}"/><text class="avglab" x="${W-R+6}" y="${y(avg)+3}">Avg ${avg}</text>` : ""}
  </svg>
  <div class="fi-legend">${chips}<span style="color:var(--ink-faint)">tap a season to hide/show (dashed chip = FBref, not Simon&rsquo;s sheet) &middot; red dashed boxes = injuries (${FI_CUR}; hide all but one past season to see its injuries) &middot; dashed line = ${FI_CUR} season average &middot; 4-week rolling average of minutes per week, all competitions incl. internationals, by week of season</span></div></div>`;
}

// "Leverkusen · FBref" under a season band; Liverpool seasons from Simon's sheet need no tag
function fiSeasonTag(m, s){
  if (!m) return s === FI_CUR ? "Liverpool" : "";
  const clubs = (m.clubs || []).filter(c => c !== "Liverpool");
  const club = (m.clubs || []).length > 1 ? m.clubs.join(" / ") : (m.clubs || [])[0] || "";
  if (m.source === "fbref") return `${club.length > 22 ? club.slice(0, 21) + "\u2026" : club} \u00b7 FBref`;
  return clubs.length ? club : "Liverpool";
}
function fiCareerTable(name){

  return `<div class="tablewrap" style="margin-top:10px"><table class="fi-ctab"><thead><tr><th class="playercol">Season</th><th>Club</th>
      <th class="num" title="Appearances, all competitions incl. internationals">Apps</th><th class="num">Starts</th><th class="num">Mins</th>
      <th class="num" title="Club minutes as a share of his clubs\u2019 competitive fixtures while he was there \u00d7 90">% avail</th><th class="num" title="Days injured inside the season (1 Jul\u201330 Jun)">Inj days</th><th>Weekly source</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td>${r.season}</td><td style="text-align:left">${esc((r.clubs || []).join(" / ") || "\u2013")}</td>
      <td class="num">${r.apps}</td><td class="num">${r.starts}</td><td class="num">${r.mins.toLocaleString("en-GB")}</td>

    <div class="empty" style="padding:6px 0 0;text-align:left;font-size:11px">Apps, starts and minutes from FBref match logs (all competitions incl. internationals; FBref counts 90 a game, no stoppage time). Weekly lines use Simon's sheet where he has the season, FBref otherwise.</div>`;
}
// one continuous 4-week rolling line across every season he has weekly data for, then 26/27
function fiCareer(name){
  const hist = (DATA.weekly_history || {})[name] || {};
  const seasons = Object.keys(hist).sort().filter(s => (hist[s] || []).some(p => (p.mins || 0) > 0));
  if (!seasons.length) return `<div class="empty" style="padding:10px 0;text-align:left">No historic weekly data.</div>`;
  const stream = [];
  seasons.forEach(s => hist[s].forEach(p => stream.push({ s, week:p.week, mins:p.mins, wc:p.wc })));
  ((DATA.fatigue_index[name] || {}).weekly || []).forEach(p => stream.push({ s:FI_CUR, week:p.week, mins:p.mins }));
  const roll = rolling4(stream).map((r, i) => ({ ...stream[i], roll:r.mins }));
  const n = roll.length, raw = stream.filter(p => p.mins != null);
  const avg = raw.length ? Math.round(raw.reduce((a,p) => a + p.mins, 0) / raw.length) : null;
  const yTop = Math.ceil(Math.max(200, ...roll.map(p => p.roll)) / 50) * 50;
  const W = Math.max(1100, Math.round(n * 2.5) + 100), H = 244, L = 36, R = 64, T = 34, B = 12;
  const cmeta = (DATA.career_meta || {})[name] || {};
  const x = i => L + i / Math.max(1, n - 1) * (W - L - R);
  const y = v => T + (1 - v / yTop) * (H - T - B);
  let g = "", i0 = 0;
  const spans = [];
  roll.forEach((p, i) => { if (i === n - 1 || roll[i+1].s !== p.s){ spans.push([p.s, i0, i]); i0 = i + 1; } });
  spans.forEach(([s, a, b], k) => {
    const xa = k ? (x(a) + x(a-1)) / 2 : L, xb = b === n - 1 ? W - R : (x(b) + x(b+1)) / 2;
    g += `<rect x="${xa}" y="${T}" width="${xb - xa}" height="${H - T - B}" fill="${k % 2 ? "var(--surface-2)" : "transparent"}"/>`
       + `<text x="${(xa + xb) / 2}" y="${T - 19}" text-anchor="middle"${s === FI_CUR ? ' style="fill:var(--accent-ink)"' : ""}>${s}</text>`
       + `<text class="sub" x="${(xa + xb) / 2}" y="${T - 7}" text-anchor="middle">${esc(fiSeasonTag(cmeta[s], s))}</text>`;
  });
  const wc = roll.map((p, i) => p.wc ? i : -1).filter(i => i >= 0);
  if (wc.length) g += `<rect x="${x(wc[0]) - 2}" y="${T}" width="${x(wc[wc.length-1]) - x(wc[0]) + 4}" height="${H - T - B}" fill="var(--accent-soft)" opacity=".8"/>`
    + `<text x="${(x(wc[0]) + x(wc[wc.length-1])) / 2}" y="${T + 11}" text-anchor="middle" style="fill:var(--accent-ink)">World Cup 2026</text>`;
  for (let v = 0; v <= yTop; v += 50) g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const d = roll.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.roll).toFixed(1)}`).join("");
  const xsC = roll.map((p, i) => x(i)), ysC = roll.map(p => y(p.roll));
  const cboxes = fiSpells(name).map(s => {
    const idx = roll.map((p, i) => FI_SEASON_START[p.s] && p.week >= fiWeekOf(p.s, s.from) && p.week <= fiWeekOf(p.s, s.to) ? i : -1).filter(i => i >= 0);
    return idx.length ? fiInjBox(xsC, ysC, idx[0], idx[idx.length - 1], s) : "";
  }).join("");
  const hov = roll.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.roll).toFixed(1)}" r="3.2" fill="transparent"><title>${p.s} week ${p.week}: 4-week average ${p.roll} mins${p.wc ? " (World Cup 2026, spread evenly)" : ""}</title></circle>`).join("");
  return `<div class="fi-career"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Career 4-week rolling minutes for ${esc(name)}">
    ${g}<line class="ax" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>${cboxes}${hov}
    ${avg != null ? `<line class="avg" x1="${L}" x2="${W-R}" y1="${y(avg)}" y2="${y(avg)}"/><text class="avglab" x="${W-R+6}" y="${y(avg)+3}">Avg ${avg}</text>` : ""}
  </svg></div>`;
}

function fiDonut(apps){
  const parts = FI_APPS.map(([k,l,c]) => ({ l, c, v: apps[k] || 0 })).filter(p => p.v > 0);
  const total = parts.reduce((a,p)=>a+p.v,0);
  const r = 62, C = 2 * Math.PI * r;
  let off = 0;
  const segs = parts.map(p => { const len = p.v / total * C;
    const s = `<circle cx="85" cy="85" r="${r}" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"><title>${esc(p.l)}: ${p.v}</title></circle>`;
    off += len; return s; }).join("");
  return `<div class="fi-donut"><svg viewBox="0 0 170 170" role="img" aria-label="Appearance breakdown">
      <circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="22"/>${segs}
      <text class="c" x="85" y="88" text-anchor="middle">${total}</text><text class="cl" x="85" y="104" text-anchor="middle">matchdays</text></svg>
    <div class="fi-apps">${FI_APPS.filter(([k]) => apps[k]).map(([k,l,c]) => `<div><span><i style="background:${c}"></i>${esc(l)}</span><b class="mono">${apps[k]}</b></div>`).join("") || `<div><span>No matchdays logged</span></div>`}</div></div>`;
}

function fiSeasons(tot){
  const keys = Object.keys(tot || {});
  if (!keys.length) return "";
  const max = Math.max(...keys.map(k => tot[k] || 0), 1);
  return `<div class="fi-seasons">${keys.map(k => {
    const v = tot[k]; const proj = /proj/i.test(k); const cur = k === "25/26";
    return `<div class="b"><span class="v">${v ? (v/1000).toFixed(1)+"k" : "&ndash;"}</span><div class="bar${proj?" proj":cur?" cur":""}" style="height:${v ? Math.max(2, v/max*86) : 0}%"></div><span class="s">${esc(proj ? "26/27p" : k)}</span></div>`;
  }).join("")}</div>`;
}

function renderFiPlayer(name){
  const p = (DATA.fatigue_index || {})[name];
  if (!p) return `<div class="empty">Pick a player.</div>`;
  const m = p.metrics || {};
  const tiles = [["Fatigue Index", fiBadge(name)], ["Season mins", fiNum(m.season_mins)], ["LFC mins", fiNum(m.lfc_mins)], ["% started", fiNum(m.pct_started)],
    ["Weekly ave", fiNum(m.weekly_ave, 2)], ["% vs 3yr ave", fiNum(m.pct_vs_3yr)], ["% vs career max", fiNum(m.pct_vs_career_max)],
    ["Vs optimal", fiNum(m.vs_optimal)], ["Risk factor", riskBadge(m.risk_factor)]];
  return `<div class="fi-tiles">${tiles.map(([l,v]) => `<div class="record-tile"><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>
    <div class="fi-row"><div id="fiChartBox">${fiChart(name)}</div>${fiDonut(p.apps || {})}</div>
    <div style="margin-top:16px"><div class="fi-injhd"><span>Career load</span><span class="sub">4-week rolling average of weekly minutes, every season on record &middot; red dashed boxes = injuries &middot; dashed line = career weekly average</span></div>${fiCareer(name)}${fiCareerTable(name)}</div>
    <div style="margin-top:18px">${fiPublished(name)}</div>
    <div style="margin-top:16px">${fiInjuries(name)}</div>
    <div style="margin-top:16px"><div class="sub" style="color:var(--ink-faint);font-size:11.5px">Season minutes, all competitions (dashed = 2026&ndash;27 projection)</div>${fiSeasons(p.season_totals)}</div>`;
}

function renderFatigueTab(){
  const players = fiPlayers();
  if (!players.length) return `<div class="empty">No Fatigue Index data yet.</div>`;
  if (!fiPlayer || !players.includes(fiPlayer)) fiPlayer = players.includes("VVD") ? "VVD" : players[0];
  return `<div class="stack">
    <div class="card"><div class="hd"><h2 id="fiName">${esc(fiPlayer)}</h2><span class="sub">Fatigue Index &middot; 2026&ndash;27</span></div>
      <div class="bd" id="fiPlayer">${renderFiPlayer(fiPlayer)}</div></div>
    <div class="card"><div class="hd"><h2>Squad load</h2><span class="sub">tap a player &middot; tap a column to sort</span></div>
      <div class="bd" id="fiTable">${renderFiTable()}</div></div>
  </div>`;
}

function wireSeasons(){
  document.querySelectorAll("button[data-fisea]").forEach(el => el.addEventListener("click", () => {
    const s = el.dataset.fisea; fiHidden.has(s) ? fiHidden.delete(s) : fiHidden.add(s);
    document.getElementById("fiChartBox").innerHTML = fiChart(fiPlayer); wireSeasons(); }));
}
function wireFatigue(){
  wireSeasons();
  document.querySelectorAll("tr[data-fiplayer]").forEach(el => {
    const pick = () => { fiPlayer = el.dataset.fiplayer;
      document.getElementById("fiName").textContent = fiPlayer;
      document.getElementById("fiPlayer").innerHTML = renderFiPlayer(fiPlayer);
      document.getElementById("fiTable").innerHTML = renderFiTable(); wireFatigue();
      document.getElementById("fiName").scrollIntoView({ behavior:"smooth", block:"center" }); };
    el.addEventListener("click", pick);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); } });
  });
  document.querySelectorAll("th[data-ficol]").forEach(el => {
    el.addEventListener("click", () => { const c = el.dataset.ficol;
      fiSort.dir = fiSort.col === c ? fiSort.dir * -1 : -1; fiSort.col = c;
      document.getElementById("fiTable").innerHTML = renderFiTable(); wireFatigue(); });
  });
}

// ---------- main render ----------
function render(){
  renderTabs();
  const tab = TABS.find(t => t.id === activeTab);
  const app = document.getElementById("app");

  if (tab.kind === "fi"){
    app.innerHTML = renderFatigueTab();
    wireFatigue();
    return;
  }

  if (tab.kind === "intl"){
    app.innerHTML = `
      <div class="card"><div class="hd"><h2>International caps</h2><span class="sub">Goals &amp; assists &middot; current window</span></div>
      <div class="bd">${renderInternationals()}</div></div>`;
    return;
  }

  const records = tab.kind === "all" ? recordsForTab(TABS.find(t=>t.id==="LFC")) : recordsForTab(tab);
  const matches = tab.kind === "all" ? matchesForTab(TABS.find(t=>t.id==="LFC")) : matchesForTab(tab);

  app.innerHTML = `
    <div class="stack" style="margin-bottom:18px">${renderRecordStrip(matches)}</div>
    <div class="grid">
      <div class="stack">
        <div class="card">
          <div class="hd"><h2>Matches</h2><span class="sub">tap a match for the box score</span></div>
          <div class="bd flush">${renderMatchStrip(matches, tab)}</div>
          <div class="bd" id="matchDetail">${renderMatchDetail(matches, records)}</div>
        </div>
        <div class="card">
          <div class="hd"><h2>Squad season summary</h2><span class="sub">${esc(tab.label)}</span></div>
          <div class="bd" id="squadSummary">${renderSquadSummary(records)}</div>
        </div>
        ${tab.kind === "all" ? `<div class="card"><div class="hd"><h2>Club + international totals</h2></div><div class="bd">${renderAllCombined(records)}</div></div>` : ""}
      </div>
      <div class="stack">
        <div class="card">
          <div class="hd"><h2>Single-match leaderboard</h2><span class="sub">best individual match performances</span></div>
          <div class="bd" id="lbBox">${renderLeaderboard(records)}</div>
        </div>
        ${(tab.id === "LFC" || tab.id === "ALL") ? `
        <div class="card">
          <div class="hd"><h2>Season rate leaderboard</h2><span class="sub">from the pod's season totals</span></div>
          <div class="bd" id="srBox">${renderSeasonRates()}</div>
        </div>` : ""}
        <div class="card">
          <div class="hd"><h2>Season-high feed</h2><span class="sub">records as they happened</span></div>
          <div class="bd flush">${renderHighsFeed(records)}</div>
        </div>
      </div>
    </div>
  `;
  wireInteractions(records, matches, tab);
}

function wireInteractions(records, matches, tab){
  document.querySelectorAll(".mcard").forEach(el => {
    el.addEventListener("click", () => { selectedMatch = el.dataset.match; render(); });
    el.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); selectedMatch = el.dataset.match; render(); } });
  });

  const lbSearch = document.getElementById("lbSearch");
  if (lbSearch){
    lbSearch.addEventListener("change", () => {
      const metricsAvail = new Set();
      records.forEach(r => Object.keys(r.stats).forEach(k => { if (typeof r.stats[k] === "number") metricsAvail.add(k); }));
      const found = [...metricsAvail].find(m => label(m).toLowerCase() === lbSearch.value.trim().toLowerCase());
      if (found){ lbMetric = found; lbDir = bestDir(found); document.getElementById("lbBox").innerHTML = renderLeaderboard(records); wireInteractions(records, matches, tab); }
    });
  }
  const lbDirBtn = document.getElementById("lbDirBtn");
  const lbAllBtn = document.getElementById("lbAllBtn");
  if (lbAllBtn) lbAllBtn.addEventListener("click", () => { lbAll = !lbAll; document.getElementById("lbBox").innerHTML = renderLeaderboard(records); wireInteractions(records, matches, tab); });
  if (lbDirBtn) lbDirBtn.addEventListener("click", () => { lbDir *= -1; document.getElementById("lbBox").innerHTML = renderLeaderboard(records); wireInteractions(records, matches, tab); });

  document.querySelectorAll(".chip[data-metric]").forEach(el => {
    el.addEventListener("click", () => { lbMetric = el.dataset.metric; lbDir = bestDir(lbMetric); document.getElementById("lbBox").innerHTML = renderLeaderboard(records); wireInteractions(records, matches, tab); });
  });

  const srSearch = document.getElementById("srSearch");
  if (srSearch){
    srSearch.addEventListener("change", () => {
      const totals = DATA.dashboard_season_totals || {};
      const metricsAvail = new Set();
      Object.values(totals).forEach(p => Object.keys(p).forEach(k => { if (typeof p[k]==="number" && !["Height","Age 1 Aug"].includes(k)) metricsAvail.add(k); }));
      const found = [...metricsAvail].find(m => label(m).toLowerCase() === srSearch.value.trim().toLowerCase());
      if (found){ srMetric = found; srDir = bestDir(found); document.getElementById("srBox").innerHTML = renderSeasonRates(); wireInteractions(records, matches, tab); }
    });
  }

  const srRerender = () => { document.getElementById("srBox").innerHTML = renderSeasonRates(); wireInteractions(records, matches, tab); };
  const srDirBtn = document.getElementById("srDirBtn");
  if (srDirBtn) srDirBtn.addEventListener("click", () => { srDir *= -1; srRerender(); });
  const srAllBtn = document.getElementById("srAllBtn");
  if (srAllBtn) srAllBtn.addEventListener("click", () => { srAll = !srAll; srRerender(); });

  document.querySelectorAll("#squadSummary thead th[data-col]").forEach(el => {
    el.addEventListener("click", () => {
      const col = el.dataset.col;
      squadSort.dir = (squadSort.col === col) ? squadSort.dir * -1 : -1;
      squadSort.col = col;
      document.getElementById("squadSummary").innerHTML = renderSquadSummary(records);
      wireInteractions(records, matches, tab);
    });
  });

  document.querySelectorAll("#matchDetail thead th[data-col]").forEach(el => {
    el.addEventListener("click", () => {
      const col = el.dataset.col;
      matchSort.dir = (matchSort.col === col) ? matchSort.dir * -1 : -1;
      matchSort.col = col;
      // re-rendering swaps in a fresh scroll container, which would otherwise
      // snap back to the top-left -- capture and restore the scroll position
      // so sorting doesn't force a re-scroll across the whole wide table.
      const oldPanel = document.querySelector("#matchDetail .wide-wrap");
      const scrollLeft = oldPanel ? oldPanel.scrollLeft : 0;
      const scrollTop = oldPanel ? oldPanel.scrollTop : 0;
      document.getElementById("matchDetail").innerHTML = renderMatchDetail(matches, records);
      const newPanel = document.querySelector("#matchDetail .wide-wrap");
      if (newPanel){ newPanel.scrollLeft = scrollLeft; newPanel.scrollTop = scrollTop; }
      wireInteractions(records, matches, tab);
    });
  });
}

// ---------- iframe auto-height (for embedding on simonbrundish.com) ----------
// Posts this page's height to the parent window whenever content changes, so
// a parent page can resize the <iframe> to fit -- no fixed height, no inner
// scrollbar. No-ops when the page isn't embedded in an iframe.
function broadcastHeight(){
  if (window.self === window.top) return;
  const h = document.documentElement.scrollHeight;
  // dashHeight is the shared key the simonbrundish.com/data listener reads for every dashboard
  window.parent.postMessage({ upPressureHeight: h, dashHeight: h }, "*");
}
new ResizeObserver(broadcastHeight).observe(document.documentElement);

// ---------- boot ----------
fetch("under-pressure-data.json").then(r => r.json()).then(data => {
  DATA = data;
  const dt = new Date();
  document.getElementById("lastUpdated").textContent = "data as of latest pull";
  render();
  broadcastHeight();
}).catch(err => {
  document.getElementById("app").innerHTML = `<div class="empty">Couldn't load match data (${esc(err.message)}). Try refreshing.</div>`;
  broadcastHeight();
});

})();
</script>
