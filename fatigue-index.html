<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fatigue Index</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Always the dark green pod branding (matches Under Pressure) -- no
   light/dark toggle, so it never falls back to a light theme regardless of
   the viewer's system theme or embedding page. */
:root{
  color-scheme: dark;
  --bg:#0a1f14; --surface:#102a1c; --surface-2:#16351f; --sunk:#0d2417;
  --ink:#eef4ee; --ink-soft:#a9c2ad; --ink-faint:#6f8874;
  --line:#20452e; --line-strong:#2c5a3c;
  --accent:#a992ff; --accent-ink:#c3b4ff; --accent-soft:#211a3d;
  --green:#4ade80; --green-soft:#1a4a2c;
  --amber:#e6a44b; --amber-soft:#3a2c12;
  --red:#f8737f; --red-soft:#3a1a1e;
  --bar-track:#1c4126;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -18px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0}
a{color:var(--accent-ink)}
button{font:inherit}

header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .row{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand h1{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.brand h1.gradient{
  font-size:1.7rem;font-weight:800;
  background:linear-gradient(90deg,#f2836b,#8ab4f8,#8ab4f8,#f7cf9b,#e896d6,#f4a9d9,#a8e6b8);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:11px;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{font-weight:600;font-size:13px;border:0;background:transparent;color:var(--ink-soft);
  padding:6px 14px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
select,input[type=search]{font:inherit;font-weight:500;font-size:13px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px}
main{max-width:1320px;margin:0 auto;padding:20px 20px 90px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .lab{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace}
.kpi .val{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:1.55rem;line-height:1.1;margin-top:5px}
.kpi .sub{font-size:11px;color:var(--ink-soft);margin-top:2px}
.kpi.red .val{color:var(--red)} .kpi.amber .val{color:var(--amber)} .kpi.hero .val{color:var(--accent-ink)}

.compbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.compbar .lab{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace}
.compbar .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.compbar .compnote{font-size:11.5px;color:var(--ink-faint)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.controls label{font-size:11px;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;display:flex;flex-direction:column;gap:3px}
.chk{flex-direction:row!important;align-items:center;gap:6px;color:var(--ink-soft);font-size:12px;cursor:pointer}

.asof{display:flex;flex-direction:column;gap:4px;flex:1;min-width:260px}
.asof .track{display:flex;align-items:center;gap:10px}
.asof input[type=range]{flex:1;accent-color:var(--accent)}
.asof .d{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;white-space:nowrap}

.note{font-size:11.5px;color:var(--ink-faint);margin:6px 2px 18px;max-width:100ch}
.note b{color:var(--ink-soft);font-weight:600}
.banner{background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;padding:9px 13px;
  font-size:12px;color:var(--ink);margin-bottom:14px}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;
  cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface);z-index:5}
th.l,td.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.num{font-family:"IBM Plex Mono",monospace}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;font-family:"IBM Plex Mono",monospace}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.spike{background:var(--red-soft);color:var(--red)}
.pill.flag{background:var(--amber-soft);color:var(--amber)}
.pill.muted{background:var(--surface-2);color:var(--ink-faint)}
.idxcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.idxbar{width:52px;height:7px;border-radius:4px;background:var(--bar-track);overflow:hidden;flex:none}
.idxbar i{display:block;height:100%}
.mini{display:inline-flex;gap:2px;vertical-align:middle}
.mini i{width:7px;height:14px;border-radius:2px;background:var(--bar-track);display:block}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,10,.45);z-index:40;opacity:0;pointer-events:none;transition:.15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--bg);z-index:41;
  transform:translateX(100%);transition:.2s;overflow-y:auto;border-left:1px solid var(--line-strong);box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer .dh{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:flex-start;gap:12px}
.drawer .dh h2{font-size:1.2rem;letter-spacing:-.01em}
.drawer .dh .meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
.drawer .x{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--ink-soft);flex:none}
.dbody{padding:18px 20px}
.gauge{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.gauge b{font-family:"IBM Plex Mono",monospace;font-size:2.4rem;font-weight:600;line-height:1}
.sub{margin:16px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;border-bottom:1px solid var(--line);padding-bottom:5px}
.sbar{display:grid;grid-template-columns:120px 1fr 42px;gap:8px;align-items:center;margin:7px 0;font-size:12px}
.sbar .t{width:100%;height:8px;border-radius:5px;background:var(--bar-track);overflow:hidden}
.sbar .t i{display:block;height:100%}
.sbar .v{font-family:"IBM Plex Mono",monospace;text-align:right;color:var(--ink-soft)}
.sbar.off{opacity:.4}
.spark{width:100%;height:74px;margin:4px 0 2px}
.spark text{font-family:"IBM Plex Mono",monospace;font-size:9px;fill:var(--ink-faint)}
.matchlist{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);margin-top:6px}
.matchlist div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid var(--line)}
.foot{margin-top:40px;font-size:11px;color:var(--ink-faint);line-height:1.7}
.foot code{background:var(--surface-2);padding:1px 4px;border-radius:4px}
.methodwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow);max-width:900px}
.methodwrap h3{font-size:1rem;margin:18px 0 8px}
.methodwrap h3:first-child{margin-top:0}
.methodwrap p,.methodwrap li{font-size:13px;color:var(--ink-soft);line-height:1.6}
.methodwrap table{box-shadow:none;margin:8px 0}
.methodwrap td,.methodwrap th{border-bottom:1px solid var(--line)}
.hide{display:none!important}
.ih{font-size:.95rem;margin:4px 2px 10px}
#ikpis .kpi .val.txt{font-size:1.05rem;line-height:1.3}
#itable tbody tr{cursor:pointer}
#itable tbody tr.sel td{background:var(--surface-2)}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div class="brand"><h1 class="gradient">Fatigue Index</h1><span id="subttl">Premier League · load &amp; running</span></div>
    <div class="seg" id="views">
      <button data-v="players" aria-pressed="true">Players</button>
      <button data-v="teams">Teams</button>
      <button data-v="injuries">Injuries</button>
      <button data-v="method">Method</button>
    </div>
  </div>
</header>
<main>
  <div id="banner" class="banner hide"></div>
  <div class="asof" id="asofwrap">
    <label>AS-OF DATE — scrub through the season</label>
    <div class="track">
      <input type="range" id="asof" min="0" max="0" value="0">
      <span class="d mono" id="asofd">—</span>
    </div>
  </div>

  <section id="view-players">
    <div class="compbar" id="compbar" hidden>
      <span class="lab">COMPETITION</span>
      <div class="seg" id="comp-seg">
        <button data-comp="pl" aria-pressed="true">Premier League</button>
        <button data-comp="cl" aria-pressed="false">Champions League</button>
        <button data-comp="cup" aria-pressed="false">Cup &amp; Intl</button>
        <button data-comp="all" aria-pressed="false">All comps</button>
      </div>
      <span class="compnote" id="compnote"></span>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="controls">
      <label>CLUB<select id="f-club"><option value="">All</option></select></label>
      <label>ROLE<select id="f-role"><option value="">All</option><option>GK</option><option>CB</option><option>FB</option><option>CM</option><option>WM</option><option>FW</option></select></label>
      <label>BAND<select id="f-band"><option value="">All</option><option value="red">Red</option><option value="amber">Amber</option><option value="green">Green</option></select></label>
      <label>SEARCH<input type="search" id="f-q" placeholder="player…"></label>
      <label>MINUTES<select id="f-minwin"><option value="1">2026/27 only</option><option value="2">last 2 seasons</option></select></label>
      <label class="chk"><input type="checkbox" id="f-early"> hide early-season</label>
      <label class="chk"><input type="checkbox" id="f-ranked"> ranked only</label>
    </div>
    <div class="note" id="squadnote" style="margin:-6px 2px 12px"></div>
    <div style="overflow-x:auto"><table id="ptable"><thead></thead><tbody></tbody></table></div>
  </section>

  <section id="view-teams" class="hide">
    <div style="overflow-x:auto"><table id="ttable"><thead></thead><tbody></tbody></table></div>
  </section>

  <section id="view-injuries" class="hide">
    <div class="kpis" id="ikpis"></div>
    <div class="note" id="inote" style="margin:-6px 2px 12px"></div>
    <h3 class="ih">By club, 2026/27 so far</h3>
    <div style="overflow-x:auto"><table id="itable"><thead></thead><tbody></tbody></table></div>
    <div class="controls" style="margin-top:22px">
      <label>CLUB<select id="i-club"><option value="">All</option></select></label>
      <label>SHOW<select id="i-show"><option value="cur">Injured now</option><option value="season">Every spell this season</option></select></label>
    </div>
    <div style="overflow-x:auto"><table id="iltable"><thead></thead><tbody></tbody></table></div>
  </section>

  <section id="view-method" class="hide"><div class="methodwrap" id="method"></div></section>

  <div class="foot" id="foot"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"><div class="dh"><div><h2 id="d-name"></h2><div class="meta" id="d-meta"></div></div><button class="x" id="d-x">✕</button></div><div class="dbody" id="d-body"></div></aside>

<script id="fdata-parts" type="application/json">{"v":"9e68ff832f","core":"fatigue-data/core.json","parts":["fatigue-data/snapshots-2025-10.json","fatigue-data/snapshots-2025-11.json","fatigue-data/snapshots-2025-12.json","fatigue-data/snapshots-2026-01.json","fatigue-data/snapshots-2026-02.json","fatigue-data/snapshots-2026-03.json","fatigue-data/snapshots-2026-04.json","fatigue-data/snapshots-2026-05.json","fatigue-data/snapshots-2026-06.json","fatigue-data/snapshots-2026-08.json","fatigue-data/snapshots-2026-09.json","fatigue-data/snapshots-2026-10.json","fatigue-data/series.json","fatigue-data/injuries.json"]}</script>
<script>
// data lives next to the page in fatigue-data/ (written by slim_publish.py)
async function loadFatigueData(){
  const P = JSON.parse(document.getElementById('fdata-parts').textContent);
  const get = f => fetch(f + '?v=' + P.v).then(r => { if(!r.ok) throw new Error(f + ' ' + r.status); return r.json(); });
  const [core, ...parts] = await Promise.all([P.core, ...P.parts].map(get));
  for(const part of parts) for(const [k, v] of Object.entries(part)) core[k] = Object.assign(core[k] || {}, v);
  return core;
}
</script>
<script>
(async () => {
const DATA = await loadFatigueData();
const BIOS = DATA.bios || {};
const RAWSNAPS = DATA.snapshots || {[DATA.as_of]: {players:DATA.players, teams:DATA.teams}};
// merge static bio fields into each per-snapshot player row
const SCORE_ORDER = ["injury_hist","season_load","congestion","min_acwr","hi_acwr","hi_pct_swing","sprint_spike","age_youth","travel"];
const SNAPS = {};
for(const [d,s] of Object.entries(RAWSNAPS))
  SNAPS[d] = {teams:s.teams, players:s.players.map(r=>{
    const o = Object.assign({}, BIOS[r.fbref_id]||{}, r);
    if(r.s) o.scores = Object.fromEntries(SCORE_ORDER.map((k,i)=>[k, r.s[i]]));
    return o;
  })};
const DATES = Object.keys(SNAPS).sort();
const ALLPLAYERS = [].concat(...DATES.map(d=>SNAPS[d].players));
const SERIES = DATA.series||{}, W = DATA.weights, STD = DATA.standards;
const INJURIES = DATA.injuries||{};
const SCOREKEYS = SCORE_ORDER;
const SCORELAB = {injury_hist:"Prior injury burden",season_load:"Season load vs history",
  congestion:"Fixture congestion",min_acwr:"Minutes ACWR",hi_acwr:"Hi-intensity ACWR",
  sprint_spike:"Sprint load spike",hi_pct_swing:"Hi-speed % swing",age_youth:"Age / youth",
  travel:"International travel"};
let cur = {date: DATES[DATES.length-1], view:'players', sort:'index', dir:-1,
           club:'', role:'', band:'', q:'', early:false, ranked:false, minwin:'1', comp:'pl'};
const HAS_OTHER_COMPS = ALLPLAYERS.some(p => (p.cl_min||0) > 0 || (p.cup_min||0) > 0);
// current-season minutes for the chosen competition. "cup" = everything that
// isn't PL or Champions League (FA/EFL Cup, internationals, one-off finals);
// "all" = every competition summed — the fatigue index itself always was.
const compMin = p => cur.comp==='cl' ? (p.cl_min||0)
               : cur.comp==='cup' ? (p.cup_min||0)
               : cur.comp==='all' ? (p.season_min||0) + (p.cl_min||0) + (p.cup_min||0)
               : (p.season_min||0);
// column value: competition minutes, plus last season if the 25–27 window is on
const seasonMin = p => compMin(p) + (cur.minwin==='2' ? (p.prev_season_min||0) : 0);
const compLabel = () => cur.comp==='cl' ? 'CL' : cur.comp==='cup' ? 'Cup/Intl' : cur.comp==='all' ? 'All' : 'PL';

const bandColor = b => b==='red'?'var(--red)':b==='amber'?'var(--amber)':b==='green'?'var(--green)':'var(--ink-faint)';
const fmt = (v,d=1)=> v==null||isNaN(v) ? '–' : (+v).toFixed(d);
const scoreColor = s => s==null?'var(--bar-track)': s>65?'var(--red)': s>=40?'var(--amber)':'var(--green)';

function snap(){ return SNAPS[cur.date]; }
function players(){ return snap().players; }
// Load score: pure workload (not risk). 60+ = high, 35-60 = elevated.
function loadColor(v){ return v==null?'var(--bar-track)': v>=60?'var(--red)': v>=35?'var(--amber)':'var(--green)'; }
function loadCell(v){
  if(v==null) return '<span style="color:var(--ink-faint)">–</span>';
  return `<span class="idxcell" title="Load score — recent workload, not injury risk"><span class="idxbar"><i style="width:${v}%;background:${loadColor(v)}"></i></span><b class="mono">${fmt(v,0)}</b></span>`;
}

/* ---------- as-of slider ---------- */
const asof = document.getElementById('asof'), asofd = document.getElementById('asofd');
asof.max = DATES.length-1; asof.value = DATES.length-1;
document.getElementById('asofwrap').classList.toggle('hide', DATES.length<2);
asof.oninput = () => { cur.date = DATES[+asof.value]; asofd.textContent = cur.date; render(); };
asofd.textContent = cur.date;

/* ---------- views ---------- */
document.getElementById('views').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  cur.view = b.dataset.v;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed', x===b));
  document.getElementById('view-players').classList.toggle('hide', cur.view!=='players');
  document.getElementById('view-teams').classList.toggle('hide', cur.view!=='teams');
  document.getElementById('view-injuries').classList.toggle('hide', cur.view!=='injuries');
  document.getElementById('view-method').classList.toggle('hide', cur.view!=='method');
  document.getElementById('asofwrap').classList.toggle('hide', cur.view==='method' || cur.view==='injuries' || DATES.length<2);
  render();
};

/* ---------- filters ---------- */
for(const c of [...new Set(Object.values(BIOS).map(p=>p.club).filter(Boolean))].sort())
  document.getElementById('f-club').add(new Option(c,c));
const bind = (id,k)=>{ const el=document.getElementById(id);
  el.oninput = ()=>{ cur[k]= el.type==='checkbox'?el.checked:el.value; render(); }; };
bind('f-club','club'); bind('f-role','role'); bind('f-band','band'); bind('f-q','q'); bind('f-early','early'); bind('f-ranked','ranked'); bind('f-minwin','minwin');

/* ---------- competition selector ---------- */
if(HAS_OTHER_COMPS){
  const cb = document.getElementById('compbar');
  cb.hidden = false;
  cb.querySelector('#comp-seg').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    cur.comp = b.dataset.comp;
    [...b.parentNode.children].forEach(x=>x.setAttribute('aria-pressed', x===b));
    render();
  };
}
function compNote(){
  const el = document.getElementById('compnote'); if(!el) return;
  const cl = players().filter(p=>(p.cl_min||0)>0);
  const cup = players().filter(p=>(p.cup_min||0)>0);
  const clm = cl.reduce((s,p)=>s+(p.cl_min||0),0);
  const cupm = cup.reduce((s,p)=>s+(p.cup_min||0),0);
  const other = HAS_OTHER_COMPS ? (cl.length || cup.length) : 0;
  el.textContent = cur.comp==='cl'
    ? `${cl.length} players with Champions League minutes so far (${clm.toLocaleString()}′). The fatigue index always counts all competitions — this view just filters the squad and the minutes column.`
    : cur.comp==='cup'
    ? `${cup.length} players with FA/EFL Cup, international or one-off minutes so far (${cupm.toLocaleString()}′) — e.g. this season's Carabao Cup round, and internationals as they land. Counted in the index already; this view just isolates them.`
    : cur.comp==='all'
    ? `Minutes column = every competition summed (Premier League + Champions League + cup/internationals). This is what the fatigue index has always run on — the toggle just changes what the column shows.`
    : (other ? `${cl.length} player(s) also have Champions League minutes and ${cup.length} have cup/international minutes — switch above to see them.` : '');
}

/* ---------- player table ---------- */
const PCOLS = [
  ['player','Player','l'],['club','Club','l'],['role','Pos','l'],['age','Age'],
  ['index','Fatigue index'],['load','Load'],['profile','Load profile','l'],['min_acwr','Min ACWR'],['hi_acwr','HI ACWR'],
  ['congestion','Congest','s'],['hi_pct_delta','HI% Δ'],['days_since','Rest d'],
  ['season_min','Season min'],['proj_pct','Proj %hist']
];
function sortVal(p,k){
  if(k==='congestion') return p.scores?.congestion ?? -1;
  if(k==='index') return p.index ?? -1;
  if(k==='load') return p.load ?? -1;
  if(k==='profile') return p.index ?? -1;
  if(k==='season_min') return seasonMin(p);
  return p[k] ?? (typeof p[k]==='string'?'':-1e9);
}
function renderPlayers(){
  const th = document.querySelector('#ptable thead'), tb = document.querySelector('#ptable tbody');
  th.innerHTML = '<tr>'+PCOLS.map(([k,l,c])=>{
    if(k==='season_min') l = `${compLabel()} min ` + (cur.minwin==='2' ? '25–27' : '26/27');
    return `<th class="${c==='l'?'l':''}" data-k="${k}">${l}${cur.sort===k?(cur.dir<0?' ▾':' ▴'):''}</th>`;
  }).join('')+'</tr>';
  th.onclick = e=>{ const t=e.target.closest('th'); if(!t)return;
    const k=t.dataset.k; cur.dir = cur.sort===k? -cur.dir : -1; cur.sort=k; render(); };

  let rows = players().filter(p=>{
    if(cur.club && p.club!==cur.club) return false;
    if(cur.role && p.role!==cur.role) return false;
    if(cur.band && p.band!==cur.band) return false;
    if(cur.early && p.early) return false;

    if(cur.comp==='cl' && !((p.cl_min||0)>0)) return false;
    if(cur.comp==='cup' && !((p.cup_min||0)>0)) return false;
    if(cur.q && !p.player.toLowerCase().includes(cur.q.toLowerCase())) return false;
    return true;
  });
  rows.sort((a,b)=>{ const x=sortVal(a,cur.sort),y=sortVal(b,cur.sort);
    return (typeof x==='string'? x.localeCompare(y) : x-y)*cur.dir; });

  tb.innerHTML = rows.map(p=>{
    const mini = `<span class="mini">`+SCOREKEYS.map(k=>`<i style="background:${scoreColor(p.scores?.[k])}" title="${SCORELAB[k]}: ${p.scores?.[k]==null?'n/a':fmt(p.scores[k],0)}"></i>`).join('')+`</span>`;
    const flag = p.hi_flag ? `<span class="pill ${p.hi_flag}">${p.hi_flag}</span>` : '';
    const idx = p.index==null ? '<span class="pill muted" title="not enough recent minutes to rank">insufficient data</span>' :
      `<span class="idxcell"><span class="idxbar"><i style="width:${p.index}%;background:${bandColor(p.band)}"></i></span><b class="mono">${fmt(p.index,0)}</b></span>`;
    return `<tr data-id="${p.fbref_id}"${p.q?'':' style="opacity:.6"'}>
      <td class="l">${p.player}${p.early?' <span class="pill muted">early</span>':''}${p.youth_overload?' <span class="pill flag">youth</span>':''}</td>
      <td class="l">${p.club}</td><td class="l">${p.role}</td>
      <td class="num">${p.age??'–'}</td>
      <td>${idx}</td>
      <td>${loadCell(p.load)}</td>
      <td class="l">${mini}</td>
      <td class="num">${fmt(p.min_acwr,2)}</td>
      <td class="num">${fmt(p.hi_acwr,2)}</td>
      <td class="num">${fmt(p.scores?.congestion,0)}</td>
      <td class="num">${p.hi_pct_delta==null?'–':(p.hi_pct_delta>0?'+':'')+fmt(p.hi_pct_delta,0)+'%'} ${flag}</td>
      <td class="num">${p.days_since}</td>
      <td class="num">${seasonMin(p).toLocaleString()}</td>
      <td class="num">${p.proj_pct==null?'–':fmt(p.proj_pct,0)+'%'}</td>
    </tr>`;
  }).join('') || `<tr><td class="l" colspan="14" style="color:var(--ink-faint);padding:20px">No players match this filter.</td></tr>`;
  tb.onclick = e=>{ const tr=e.target.closest('tr[data-id]'); if(tr) openDrawer(tr.dataset.id); };
}

    <td><span class="idxcell" title="player-games missed through injury"><span class="idxbar"><i style="width:${t.gm/mx*100}%;background:var(--red)"></i></span><b class="mono">${t.gm}</b></span></td>

  tb.onclick = e=>{ const tr=e.target.closest('tr[data-club]'); if(!tr) return;
    iClub.value = iClub.value===tr.dataset.club ? '' : tr.dataset.club; renderInjuries(); };

  const lth=document.querySelector('#iltable thead'), ltb=document.querySelector('#iltable tbody');
  let rows = sp.filter(s=>(!iClub.value || s.club===iClub.value) && (iShow.value==='season' || s.cur));
  rows.sort((a,b)=> (b.cur-a.cur) || (b.gs-a.gs) || (a.from<b.from?1:-1));
  lth.innerHTML='<tr><th class="l">Player</th><th class="l">Club</th><th class="l">Injury</th><th>Out since</th><th>Expected back</th><th>Games missed</th><th title="Transfermarkt\'s own count for the whole spell, incl. last season">TM count</th></tr>';
  ltb.innerHTML = rows.length ? rows.map(s=>`<tr data-id="${s.f}">
    <td class="l"><b>${s.player}</b>${s.man?` <span class="pill muted" title="${(s.note||'entered by hand').replace(/"/g,'&quot;')}">manual</span>`:''}</td><td class="l">${s.club}</td>

function spark(rows, key, label, fmtv=(v)=>v, injuries=[]){
  const pts = rows.filter(r=>r[key]!=null);
  if(pts.length<2) return '';
  const W=520,H=74,pad=6;
  const xs = pts.map((_,i)=>i/(pts.length-1)*(W-2*pad)+pad);
  const vs = pts.map(r=>r[key]);
  const lo=Math.min(...vs), hi=Math.max(...vs), rng=hi-lo||1;
  const y = v => H-pad - (v-lo)/rng*(H-2*pad-10);
  const d = xs.map((x,i)=>`${i?'L':'M'}${x.toFixed(1)},${y(vs[i]).toFixed(1)}`).join(' ');
  const dots = xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${y(vs[i]).toFixed(1)}" r="2" fill="var(--accent)"/>`).join('');
  // dashed square around the line segment bracketing each injury -- i0/i1 are the
  // last match before and first match after the spell (clamped to the ends of
  // the tracked window when the injury starts/ends outside it).
  const first = pts[0].d, last = pts[pts.length-1].d;
  const squares = injuries.filter(inj => inj.from<=last && (!inj.until || inj.until>=first)).map(inj=>{
    const untilD = inj.until || last;
    let i0=0, i1=pts.length-1;
    for(let i=0;i<pts.length;i++) if(pts[i].d < inj.from) i0=i;
    for(let i=pts.length-1;i>=0;i--) if(pts[i].d > untilD) i1=i;
    if(i1<=i0) return '';
    const x0=xs[i0], x1=xs[i1], yv0=y(vs[i0]), yv1=y(vs[i1]);
    const bx=Math.min(x0,x1)-4, by=Math.min(yv0,yv1)-5, bw=Math.abs(x1-x0)+8, bh=Math.abs(yv1-yv0)+10;
    const title = `${inj.injury||'Injury'} — ${inj.from}${inj.until?(' to '+inj.until):' (ongoing)'}${inj.days?` (${inj.days}d)`:''}`;
    return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh,10).toFixed(1)}"
      rx="3" fill="none" stroke="var(--red)" stroke-width="1.3" stroke-dasharray="3,2"><title>${title}</title></rect>`;
  }).join('');
  return `<div class="sub">${label}</div><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>${dots}${squares}
    <text x="2" y="10">${fmtv(hi)}</text><text x="2" y="${H-2}">${fmtv(lo)}</text></svg>`;
}

    <div style="font-size:13px;margin:8px 0 4px">Load score
      <b class="mono" style="font-size:1.3rem;color:${loadColor(p.load)}">${p.load==null?'–':fmt(p.load,0)}</b>
      <span style="font-size:12px;color:var(--ink-soft)"> · last 7d vs prior 4 wk <b class="mono">${fmt(p.load_ratio,2)}</b>
      · ${p.load14==null?'–':Math.round(p.load14)}′ load in 14d${p.unused28?` · ${p.unused28} unused-sub day${p.unused28>1?'s':''} in 28d`:''}</span></div>
    <div style="font-size:12px;color:var(--ink-soft)">
      ${p.early?'<span class="pill muted">early season — ACWR forming</span> ':''}

    <div style="font-size:12px;color:var(--ink-soft);margin-top:4px">
      2026/27 minutes by competition:
      <b class="mono">${(p.season_min||0).toLocaleString()}′</b> PL${(p.cl_min||0)?` · <b class="mono">${p.cl_min.toLocaleString()}′</b> Champions League`:''}${(p.cup_min||0)?` · <b class="mono">${p.cup_min.toLocaleString()}′</b> cup / international`:''}</div>
    ${p.travel_km!=null?`<div style="font-size:12px;color:var(--ink-soft);margin-top:4px">
      Last international trip: <b class="mono">${Math.round(p.travel_km).toLocaleString()}km</b> round trip

    <div class="sub">Sub-scores (0 = fresh · 100 = peak load)</div>${bars}

/* ---------- method ---------- */
function renderMethod(){
  const wrows = SCOREKEYS.map(k=>`<tr><td class="l">${SCORELAB[k]}</td><td class="num">${(W[k]*100).toFixed(0)}%</td></tr>`).join('');
  document.getElementById('method').innerHTML = `
  <h3>What the index is</h3>
  <p>A 0–100 blend of nine signals, computed per player as-of a chosen date.
  <b>Green &lt;40 · Amber 40–65 · Red &gt;65.</b> A fatigue-response bonus of up to
  ${DATA.resp_max_nudge||12} points is added when top speed, sprint output and high-speed share
  are <i>all</i> declining against the player's own recent baseline.</p>
  <p>The <b>headline index leans toward injury risk</b> — weighted to what actually tracked
  injuries in the backtest (history + cumulative load). The <b>acute columns</b> —
  ACWR, sprint spike, HI% swing — are a separate <b>load-monitoring</b> read: how hard a
  player has been worked lately vs their own norm, for rotation calls. They are shown in
  full but carry little weight in the index because they did not predict injury here.</p>
  <h3>Load score</h3>
  <p>A separate <b>workload</b> read, not part of the Fatigue index: how hard a player has been worked
  lately, regardless of injury risk. 0–100 from: last-7-day vs prior-4-week load ratio (30%) ·
  load minutes in the last 14 days, unused subs at 15′ each (30%) · fixture congestion (15%) ·
  season load vs history (15%) · international travel (10%). Not playing scores 0 here.
  <b style="color:var(--red)">60+</b> high · <b style="color:var(--amber)">35–60</b> elevated.
  Not backtested — use it for rotation calls, and the index for risk.</p>
  <h3>Weights (v2.5)</h3>
  <table><tbody>${wrows}</tbody></table>
  <h3>How it was tuned</h3>
  <p>Checked against <b>177 real soft-tissue injuries</b> from 2025/26 (Transfermarkt), comparing
  each injured player's index the week before onset with ~12,500 injury-free player-weeks. Every
  competition counts — league, cups, Europe, internationals and unused-sub days — and history only
  ever uses seasons <i>before</i> the one being scored. Weights were searched with 5-fold
  cross-validation grouped by player (no player in both train and test): CV AUC 0.668
  (0.636 with the previous weights). On 26 Oct 2026 the prior-injury weight was lowered from
  0.42 to 0.30, so history weighs less in the headline index: <b>CV AUC 0.664</b>
  (0.667 at 0.42 on the same folds); full-sample <b>AUC 0.670</b>.</p>
  <ul>
   <li><b>Prior-injury history</b> (AUC 0.665) and <b>fixture congestion</b> (0.639) carry the
     signal. Congestion only showed up once cup, European and international minutes and unused
     subs were counted — on Premier League minutes alone it looked like noise.</li>
   <li>Season load vs history (0.50) and the acute load ratios (~0.50–0.52) showed little injury
     association — kept at low weight as load-monitoring reads.</li>
   <li>The separate <b>Load score</b> reached 0.634 on its own — a useful workload read.</li>
   <li>At band level: <b>Red players were injured within 3 weeks at ~6× the Green rate</b>
     (4.9% vs 0.8%; Amber 2.1%). Still a modest predictor — treat Red as "worth a
     conversation", not a warning light.</li>
  </ul>
  <h3>Standards used</h3>
  <ul>
   <li>ACWR (acute:chronic workload ratio) — <b>uncoupled</b>: load in the last ${STD.acute_days} days vs the
     weekly average of the ${STD.chronic_days} days <i>before</i> that, so a block of games can't absorb itself
     into its own baseline. Sweet spot <b>${STD.sweet_lo}–${STD.sweet_hi}</b>,
     danger zone <b>&gt;${STD.danger}</b> (U-shaped injury risk, Williams 2017).</li>
   <li>High-intensity running &gt; <b>${STD.hi_kmh} km/h</b>; sprint &gt; <b>${STD.sprint_kmh} km/h</b>
     (Ju 2023; Morgans 2025, <i>Biology of Sport</i>). Positional load structure follows those papers;
     absolute metres are FotMob-scaled and ranked within-position.</li>
   <li>Fixture congestion — injury risk rises with ≤<b>${STD.congestion_days} days</b> between matches.</li>
   <li>High-speed % swing — recent high-speed distance share vs personal baseline:
     <b>&gt;+10%</b> = load spike, <b>&lt;−10%</b> = fatigue flag.</li>
   <li>Minutes are FBref figures <b>+4%</b> (FBref caps a full game at 90′; real matches run ~96′+).
     An <b>unused substitute</b> counts as a 15-minute load session in the minutes ratio and as half a
     match day for congestion — warm-up, activation and match-day stress, but well short of playing.</li>
   <li>Season load — all minutes played this season (club + international) per club match, projected
     to a 38-game season, vs the player's 3-season PL norm. Switches on after 4 PL games.</li>
   <li>Prior injury burden — career spell count, spells in the last 365 days, and a
     boost for the ~10 weeks after a return (re-injury window).</li>
  </ul>
  <p style="font-size:12px;color:var(--ink-faint)">ACWR scores are cohort-adjusted:
  in a congested week when the whole league's ratio rises together, the danger line
  shifts with it, so the score flags players elevated <i>relative to their peers that week</i>.
  League-wide calendar load is captured by the congestion sub-score instead.</p>
  <h3>Data</h3>
  <p>Minutes: FBref match logs, all competitions (${DATA.coverage.minutes_seasons}).
  Physical: FotMob per-match tracking, Premier League only, from ${DATA.coverage.phys_from}
  (~74% of matches tracked). 3-season minute history + injury spells: FBref / Transfermarkt.
  ${DATA.coverage.player_matches.toLocaleString()} player-matches in the pool.
  ${(DATA.coverage.unresolved_fotmob||[]).length} FotMob players could not be matched to FBref and are excluded.</p>
  <h3>Known limits</h3>
  <ul>
   <li>ACWR is suppressed for the first ~3 weeks of a season (no chronic base yet) — those players show as <i>early</i> and lean on the other signals.</li>
   <li>FA/EFL Cup, Champions League and international minutes (World Cup, qualifiers, Nations League, friendlies, Community Shield, Club World Cup) always count toward the index. The <b>Competition</b> toggle (Premier League / Champions League / Cup &amp; Intl / All comps) only changes which squad and which minutes column the table shows — Champions League running data (from FotMob, PL-club matches) is included where available. FotMob only tracks PL/Champions League/Europa League/Conference League, so every other match (domestic cups, internationals, club one-offs) gets an <i>estimated</i> dist/HI-running/sprint figure from the player's own trailing per-90 rate, scaled to minutes played — marked "est." in the match list.</li>
   <li><b>International travel</b>: each call-up window is chained through club → every match venue the player actually played at (in date order) → back to club, using each venue's real geocoded location (FBref match report → OpenStreetMap). Distance is round-trip km summed across every leg; the timezone signal is the single biggest leg's UTC-offset jump (DST-aware). Both fade to zero over ~14 days back with the club. Not backtested against injury outcomes yet — no history exists to check it against — so like the other acute signals it's a load-monitoring read, not a validated risk score, and carries a correspondingly small weight.</li>
   <li>Injury onset dates are approximate (often the date an absence was confirmed).</li>
   <li>0.67 AUC — a nudge, not a forecast. The value is the structured view, not the number.</li>
  </ul>`;
}

/* ---------- render ---------- */
function render(){
  const m = snap().meta||{};
  document.getElementById('subttl').textContent =
    `Premier League · as-of ${cur.date}` + (m.matches!=null?` · GW pool`:'');
  const anyEarly = players().some(p=>p.early && p.q);
  const bn = document.getElementById('banner');
  if(anyEarly && players().filter(p=>p.q && !p.early).length < 20){
    bn.textContent = 'Early season — most players lack the 3–4 weeks of chronic history ACWR needs. Index shown provisionally; scrub the date back for fully-formed snapshots.';
    bn.classList.remove('hide');
  } else bn.classList.add('hide');

  if(cur.view==='players'){ renderKPIs(); renderPlayers(); renderSquadNote(); compNote(); }
  else if(cur.view==='teams'){ renderTeams(); }
  else if(cur.view==='injuries'){ renderInjuries(); }
  else { renderMethod(); }
}
function renderSquadNote(){
  const el = document.getElementById('squadnote'); if(!el) return;
  const all = players();
  const ranked = all.filter(p=>p.q).length;
  el.textContent = cur.club
    ? `${cur.club}: ${all.filter(p=>p.club===cur.club).length} squad players shown, `+
      `${all.filter(p=>p.club===cur.club&&p.q).length} ranked.`
    : `${all.length} squad players across current PL clubs shown (${ranked} ranked — `+
      `the rest have played too little recently to index, but still appear).`;
}
document.getElementById('foot').innerHTML =
  `Generated ${DATA.generated}. Build: <code>fatigue/build.py</code>. `+
  `Not medical advice — a monitoring aid; see Method for how it was validated.`;
render();
})().catch(e => {
  const bn = document.getElementById('banner');
  bn.textContent = 'Could not load the Fatigue Index data (' + e.message + '). Try refreshing.';
  bn.classList.remove('hide');
});
</script>
</body>
</html>
